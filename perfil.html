<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil del Jugador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="shortcut icon" href="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/764bbd9c-6d80-481d-8136-96848f01e843/ddx6q22-c6936a5b-73d6-409d-b248-0b370494f90f.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi83NjRiYmQ5Yy02ZDgwLTQ4MWQtODEzNi05Njg0OGYwMWU4NDMvZGR4NnEyMi1jNjkzNmE1Yi03M2Q2LTQwOWQtYjI0OC0wYjM3MDQ5NGY5MGYucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.5gC4gH1VsNiJXARJGlpuWTYklhg8sRjJiXKO7IpdYeQ" type=image/x.icon" alt="logo">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --panel:#131317; --panel-2:#18181d;
    --border:#232329; --text:#ffffff; --text-dim:#9a9aa3;
    --text-faint:#a1a1aa; --accent:#8b5cf6; --accent-soft:#a78bfa;
    --win:#34d399; --win-bg:rgba(52,211,153,.12);
    --loss:#f87171; --loss-bg:rgba(248,113,113,.12);
    --gold:#fbbf24;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: radial-gradient(800px 400px at 50% 0%, rgba(139,92,246,.15), transparent), var(--bg);
    color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:40px 20px 80px; }
  
  .back-btn { display: inline-flex; align-items: center; color: var(--accent-soft); text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 30px; transition: color 0.2s; }
  .back-btn:hover { color: #ffffff; }

  /* HEADER PERFIL */
  .profile-header { display: flex; align-items: center; gap: 24px; padding-bottom: 30px; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
  .profile-avatar { width: 100px; height: 100px; border-radius: 20px; border: 3px solid var(--accent); object-fit: cover; }
  .profile-info h1 { margin: 0 0 5px 0; font-size: 32px; font-weight: 900; }
  .profile-info p { margin: 0; color: var(--text-faint); font-size: 16px; font-weight: 500; }
  .profile-rank { margin-left: auto; text-align: right; }
  .profile-rank h2 { margin: 0; font-size: 28px; color: var(--gold); font-weight: 800; }
  .profile-rank span { color: var(--text-faint); font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;}

  /* CAJA DE PARTIDA EN VIVO */
  .live-game-box { background: var(--panel); border: 1px solid #ef4444; border-radius: var(--radius); padding: 24px; margin-bottom: 40px; box-shadow: 0 0 20px rgba(239,68,68,0.15); display: none; }
  .live-game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px;}
  .live-title-wrap { display: flex; align-items: center; gap: 10px; }
  .live-game-header h3 { margin: 0; font-size: 20px; color: #ef4444; font-weight: 900; text-transform: uppercase; }
  .live-game-header .dot { width: 14px; height: 14px; background: #ef4444; border-radius: 50%; animation: pulse 1.5s infinite; }
  .live-meta { text-align: right; font-size: 13px; color: var(--text-faint); font-weight: 600; }
  .live-meta span { color: #fff; font-weight: 800; background: var(--panel-2); padding: 6px 10px; border-radius: 8px; margin-left: 8px; border: 1px solid var(--border); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  
  .teams-container { display: flex; gap: 20px; flex-wrap: wrap; }
  .team-box { flex: 1; min-width: 280px; background: var(--panel-2); border-radius: 12px; padding: 15px; border-top: 4px solid; }
  .team-box.blue { border-color: #3b82f6; }
  .team-box.red { border-color: #ef4444; }
  .team-title { font-size: 14px; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; }
  .team-box.blue .team-title { color: #3b82f6; }
  .team-box.red .team-title { color: #ef4444; }
  
  .live-player { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .live-player:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .live-champ { width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--border); background: #111;}
  
  .live-spells, .live-runes { display: flex; flex-direction: column; gap: 2px; }
  .live-spells img { width: 21px; height: 21px; border-radius: 4px; }
  .live-runes img { width: 21px; height: 21px; border-radius: 50%; background: #000; border: 1px solid var(--border);}
  
  .live-info { display: flex; flex-direction: column; justify-content: center; overflow: hidden; margin-left: 4px; }
  .live-name { font-size: 14px; font-weight: 600; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .live-name.is-me { color: var(--gold); font-weight: 900; font-size: 15px; }
  .live-rank { font-size: 11px; color: var(--text-dim); font-weight: 700; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }

  /* GRID DE ESTADÍSTICAS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .stat-card h3 { margin: 0 0 16px 0; font-size: 14px; text-transform: uppercase; color: var(--text-faint); font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
  
  .list-item { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .list-item:last-child { margin-bottom: 0; }
  .champ-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #1d1d24; }
  .item-title { font-weight: 700; font-size: 14px; }
  .item-sub { font-size: 12px; color: var(--text-dim); }
  
  /* HISTORIAL */
  .history-section h3 { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
  .matches{ display:flex; flex-direction:column; gap:8px; }
  .match{ display:grid; grid-template-columns:48px 1fr auto; align-items:center; gap:14px; padding:12px 16px; border-radius:12px; background:var(--panel); border:1px solid var(--border); }
  .match-champ-img { width: 48px; height: 48px; border-radius: 10px; }
  .match-champ{ font-size:15px; font-weight:700; color: #ffffff;}
  .match-kda{ font-size:13px; color:var(--text-faint); margin-top: 3px;}
  .result-chip{ font-size:12px; font-weight:800; padding:6px 14px; border-radius:99px; text-transform:uppercase; text-align: center; }
  .result-chip.victoria{ color:var(--win); background:var(--win-bg); border: 1px solid rgba(52,211,153,.3); }
  .result-chip.derrota{ color:var(--loss); background:var(--loss-bg); border: 1px solid rgba(248,113,113,.3); }

  #error-msg { text-align: center; padding: 50px; color: var(--loss); font-weight: bold; display: none;}
</style>
</head>
<body>

<div class="wrap">
  <a href="index.html" class="back-btn">← Volver al Ranking</a>

  <div id="error-msg">Jugador no encontrado.</div>

  <div id="profile-content" style="display: none;">
    <div class="profile-header">
      <img id="p-avatar" class="profile-avatar" src="" alt="Avatar">
      <div class="profile-info">
        <h1 id="p-name">Cargando...</h1>
        <p id="p-winrate">Winrate</p>
      </div>
      <div class="profile-rank">
        <h2 id="p-lp">0 LP</h2>
        <span id="p-tier">Rango</span>
      </div>
    </div>

    <!-- CONTENEDOR PARTIDA EN VIVO -->
    <div id="live-game-container" class="live-game-box"></div>

    <div class="stats-grid">
      <!-- Top 3 Maestrías -->
      <div class="stat-card">
        <h3>Top 3 Maestrías</h3>
        <div id="box-mastery"></div>
      </div>
      
      <!-- Top 3 Campeones (10 partidas) -->
      <div class="stat-card">
        <h3>Top Campeones (SoloQ)</h3>
        <div id="box-champs"></div>
      </div>

      <!-- Top Roles -->
      <div class="stat-card">
        <h3>Roles Más Jugados</h3>
        <div id="box-roles"></div>
      </div>
    </div>

    <div class="history-section">
      <h3>Últimas Partidas (Solo/Duo)</h3>
      <div class="matches" id="box-history"></div>
    </div>
  </div>
</div>

<script>
window.addEventListener('load', async () => {
  const params = new URLSearchParams(window.location.search);
  const jugadorId = params.get('jugador');

  if (!jugadorId) {
    document.getElementById('error-msg').style.display = 'block';
    return;
  }

  // --- LÓGICA DE PARTIDA EN VIVO ---
  const loadLiveGame = async () => {
    try {
      const liveRes = await fetch('live_data.json', { cache: 'no-store' });
      if (!liveRes.ok) return;
      const liveData = await liveRes.json();
      const liveStatus = liveData[jugadorId];
      
      if (liveStatus && liveStatus.en_partida) {
        const liveBox = document.getElementById('live-game-container');
        
        // Función para nombres de las colas
        const getQueueName = (id) => {
          const queues = {420: 'Ranked Solo/Duo', 440: 'Ranked Flex', 400: 'Normal Draft', 430: 'Normal Blind', 450: 'ARAM', 1700: 'Arena'};
          return queues[id] || 'Partida Normal';
        };

        // Formateador de tiempo a minutos y segundos (MM:SS)
        const formatDuration = (secs) => {
          if (!secs) return "00:00";
          const m = Math.floor(secs / 60);
          const s = secs % 60;
          return `${m}:${s < 10 ? '0' : ''}${s}`;
        };

        const queueName = getQueueName(liveStatus.cola || 420);
        let gameSeconds = liveStatus.tiempo || 0; // Si tu python envía el tiempo
        
        const buildTeamHtml = (team, isBlue) => {
          const color = isBlue ? 'blue' : 'red';
          const title = isBlue ? 'Lado Azul' : 'Lado Rojo';
          
          const playersHtml = team.map(p => {
            const currentName = jugadorId.split('#')[0].toLowerCase();
            const pName = p.nombre.split('#')[0].toLowerCase();
            const isMe = currentName === pName;
            const nameClass = isMe ? 'live-name is-me' : 'live-name';
            
            // Fallbacks de estilos e imágenes si la API no los tiene listos
            const rank = p.rango || 'Unranked';
            
            // Las URL de runas son de la API de DDragon
            // Nota: El backend en python deberá mandar 'runa1_img' y 'runa2_img', pero ponemos placeholders si faltan.
            const rune1Img = p.runa1_img ? `https://ddragon.leagueoflegends.com/cdn/img/${p.runa1_img}` : `https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/7200_Domination.png`;
            const rune2Img = p.runa2_img ? `https://ddragon.leagueoflegends.com/cdn/img/${p.runa2_img}` : `https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/7201_Precision.png`;

            return `
              <div class="live-player">
                <img class="live-champ" src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${p.campeon_img}.png" onerror="this.src=''">
                <div class="live-spells">
                  <img src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/spell/${p.spell1}.png" title="Hechizo 1">
                  <img src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/spell/${p.spell2}.png" title="Hechizo 2">
                </div>
                <div class="live-runes">
                  <img src="${rune1Img}" title="Runa Principal">
                  <img src="${rune2Img}" title="Runa Secundaria" style="transform: scale(0.85);">
                </div>
                <div class="live-info">
                  <span class="${nameClass}">${p.nombre.split('#')[0]}</span>
                  <span class="live-rank">${rank}</span>
                </div>
              </div>
            `;
          }).join('');
          
          return `<div class="team-box ${color}"> <div class="team-title">${title}</div> ${playersHtml} </div>`;
        };

        liveBox.innerHTML = `
          <div class="live-game-header">
            <div class="live-title-wrap">
              <div class="dot"></div>
              <h3>Jugando Ahora</h3>
            </div>
            <div class="live-meta">
              Cola: <span>${queueName}</span> 
              Duración: <span id="live-time-val">${formatDuration(gameSeconds)}</span>
            </div>
          </div>
          <div class="teams-container">
            ${buildTeamHtml(liveStatus.equipo_azul || [], true)}
            ${buildTeamHtml(liveStatus.equipo_rojo || [], false)}
          </div>
        `;
        liveBox.style.display = 'block';

        // Actualizar el reloj cada segundo
        setInterval(() => {
          gameSeconds++;
          const timeEl = document.getElementById('live-time-val');
          if(timeEl) timeEl.innerText = formatDuration(gameSeconds);
        }, 1000);
      }
    } catch (e) {
      console.log("Error cargando partida en vivo:", e);
    }
  };

  // --- LÓGICA DE DATOS DEL JUGADOR ---
  try {
    const res = await fetch('datos.json', { cache: 'no-store' });
    const data = await res.json();
    const jugadores = Array.isArray(data) ? data : (data.jugadores || []);
    const p = jugadores.find(j => j.nombre === jugadorId);
    if (!p) throw new Error("No encontrado");

    const formatImg = (name) => name.replace(/[^a-zA-Z0-9]/g,'');

    // HEADER
    document.getElementById('p-avatar').src = `https://ddragon.leagueoflegends.com/cdn/14.20.1/img/profileicon/${p.icono || 1}.png`;
    document.getElementById('p-name').innerText = p.nombre.split('#')[0]; 
    document.getElementById('p-tier').innerText = p.rango;
    document.getElementById('p-lp').innerText = `${p.lp} LP`;
    document.getElementById('p-winrate').innerText = `Tasa de victoria global: ${p.winrate}`;

    // MAESTRÍAS
    const boxMastery = document.getElementById('box-mastery');
    if(p.maestrias && p.maestrias.length > 0) {
      boxMastery.innerHTML = p.maestrias.map(m => `
        <div class="list-item">
          <img class="champ-img" src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${formatImg(m.campeon)}.png" onerror="this.style.visibility='hidden'">
          <div>
            <div class="item-title">${m.campeon}</div>
            <div class="item-sub">Nivel ${m.nivel} • ${m.puntos} pts</div>
          </div>
        </div>
      `).join('');
    } else { boxMastery.innerHTML = '<span class="item-sub">Sin datos</span>'; }

    // CAMPEONES RECIENTES
    const boxChamps = document.getElementById('box-champs');
    if(p.top_recientes && p.top_recientes.length > 0) {
      boxChamps.innerHTML = p.top_recientes.map(c => `
        <div class="list-item">
          <img class="champ-img" src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${formatImg(c.campeon)}.png" onerror="this.style.visibility='hidden'">
          <div>
            <div class="item-title">${c.campeon}</div>
            <div class="item-sub">${c.cantidad} partidas recientes</div>
          </div>
        </div>
      `).join('');
    } else { boxChamps.innerHTML = '<span class="item-sub">No ha jugado recientemente.</span>'; }

    // ROLES RECIENTES
    const boxRoles = document.getElementById('box-roles');
    if(p.top_roles && p.top_roles.length > 0) {
      boxRoles.innerHTML = p.top_roles.map(r => `
        <div class="list-item">
          <div class="champ-img" style="display:flex; align-items:center; justify-content:center; background: rgba(139,92,246,0.2); color: #a78bfa; font-weight:bold; font-size:20px;">
            ✦
          </div>
          <div>
            <div class="item-title">${r.rol}</div>
            <div class="item-sub">${r.cantidad} veces jugado</div>
          </div>
        </div>
      `).join('');
    } else { boxRoles.innerHTML = '<span class="item-sub">Sin roles detectados.</span>'; }

    // HISTORIAL
    const boxHistory = document.getElementById('box-history');
    if(p.historial && p.historial.length > 0) {
      boxHistory.innerHTML = p.historial.map(h => `
        <div class="match">
          <img class="match-champ-img" src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${formatImg(h.campeon)}.png" onerror="this.style.visibility='hidden'">
          <div>
            <div class="match-champ">${h.campeon}</div>
            <div class="match-kda">${h.kda} KDA • ${h.duracion}</div>
          </div>
          <div class="result-chip ${h.resultado.toLowerCase()}">${h.resultado}</div>
        </div>
      `).join('');
    } else { boxHistory.innerHTML = '<p class="item-sub" style="text-align:center;">No hay partidas registradas.</p>'; }

    document.getElementById('profile-content').style.display = 'block';
    
    // Llamamos a cargar la partida en vivo después de mostrar el perfil base
    loadLiveGame();

  } catch (error) {
    document.getElementById('error-msg').style.display = 'block';
    console.error(error);
  }
});
</script>
</body>
</html>
