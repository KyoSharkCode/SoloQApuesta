<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil del Jugador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="shortcut icon" href="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/764bbd9c-6d80-481d-8136-96848f01e843/ddx6q22-c6936a5b-73d6-409d-b248-0b370494f90f.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi83NjRiYmQ5Yy02ZDgwLTQ4MWQtODEzNi05Njg0OGYwMWU4NDMvZGR4NnEyMi1jNjkzNmE1Yi03M2Q2LTQwOWQtYjI0OC0wYjM3MDQ5NGY5MGYucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.5gC4gH1VsNiJXARJGlpuWTYklhg8sRjJiXKO7IpdYeQ" type="image/x-icon" alt="logo">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --panel:#131317; --panel-2:#18181d;
    --border:#232329; --text:#ffffff; --text-dim:#9a9aa3;
    --text-faint:#a1a1aa; --accent:#8b5cf6; --accent-soft:#a78bfa;
    --win:#34d399; --win-bg:rgba(52,211,153,.12);
    --loss:#f87171; --loss-bg:rgba(248,113,113,.12);
    --gold:#fbbf24;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: radial-gradient(800px 400px at 50% 0%, rgba(139,92,246,.15), transparent), var(--bg);
    color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:40px 20px 80px; }
  
  .topbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:30px; }
  .back-btn { display:inline-flex; align-items:center; color:var(--accent-soft); text-decoration:none; font-weight:600; font-size:14px; transition:color 0.2s; }
  .back-btn:hover { color:#ffffff; }
  .live-indicator{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); background:var(--panel); border:1px solid var(--border); padding:6px 12px; border-radius:999px; }
  .pulse-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; animation:pulse-live 2.2s infinite; }
  @keyframes pulse-live{ 0%{box-shadow:0 0 0 0 rgba(139,92,246,.35);} 70%{box-shadow:0 0 0 8px rgba(139,92,246,0);} 100%{box-shadow:0 0 0 0 rgba(139,92,246,0);} }

  /* HEADER PERFIL — splash art de fondo */
  .profile-header {
    position:relative; display:flex; align-items:center; gap:24px;
    padding:32px 32px 32px; margin-bottom:40px;
    border-radius:18px; overflow:hidden;
    border:1px solid var(--border);
  }
  .profile-splash {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center top;
    opacity:0.18; pointer-events:none; z-index:0;
  }
  .profile-splash-overlay {
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(10,10,12,0.95) 0%, rgba(10,10,12,0.6) 60%, rgba(10,10,12,0.2) 100%);
    z-index:1;
  }
  .profile-avatar { position:relative; z-index:2; width:100px; height:100px; border-radius:20px; border:3px solid var(--accent); object-fit:cover; flex-shrink:0; }
  .profile-info { position:relative; z-index:2; display:flex; flex-direction:column; gap:5px; }
  .name-wrapper { display:flex; align-items:center; gap:12px; }
  .profile-info h1 { margin:0; font-size:32px; font-weight:900; }
  .profile-info p { margin:0; color:var(--text-faint); font-size:16px; font-weight:500; }
  .profile-rank { position:relative; z-index:2; margin-left:auto; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .profile-rank h2 { margin:0; font-size:28px; color:var(--gold); font-weight:800; }
  .profile-rank .rank-tier-row { display:inline-flex; align-items:center; gap:8px; }
  .profile-rank span { color:var(--text-faint); font-size:14px; text-transform:uppercase; letter-spacing:0.1em; font-weight:700; }
  .profile-rank .tier-emblem { width:36px; height:36px; object-fit:contain; }

  /* RESPONSIVE */
  @media (max-width:640px){
    .wrap{ padding:24px 14px 60px; }
    .profile-header{ flex-wrap:wrap; padding:24px 20px; gap:16px; }
    .profile-splash-overlay{ background:linear-gradient(180deg, rgba(10,10,12,0.85) 0%, rgba(10,10,12,0.5) 100%); }
    .profile-rank{ margin-left:0; text-align:left; align-items:flex-start; width:100%; }
    .profile-info h1{ font-size:24px; }
    .stats-grid{ grid-template-columns:1fr; }
    .match{ grid-template-columns:auto 1fr auto; gap:10px; padding:10px 12px; }
    .topbar{ flex-direction:column; align-items:flex-start; gap:10px; }
  }

  /* CAJA EN VIVO */
  .live-status-box{
    position:relative; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:22px 24px; margin-bottom:40px;
    min-height:84px; display:flex; align-items:center; justify-content:center;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .live-status-box.offline .live-offline-text{
    color:var(--text-dim); font-weight:700; font-size:13px;
    text-transform:uppercase; letter-spacing:0.1em; opacity:.65;
  }
  .live-status-box.in-game{
    border-color:#ef4444;
    box-shadow:0 0 26px rgba(239,68,68,.25), 0 0 0 1px rgba(239,68,68,.35) inset;
    animation:pulse-status-box 2s infinite;
  }
  @keyframes pulse-status-box{
    0%   { box-shadow:0 0 26px rgba(239,68,68,.25), 0 0 0 1px rgba(239,68,68,.35) inset; }
    70%  { box-shadow:0 0 36px rgba(239,68,68,.05), 0 0 0 1px rgba(239,68,68,.5) inset; }
    100% { box-shadow:0 0 26px rgba(239,68,68,.25), 0 0 0 1px rgba(239,68,68,.35) inset; }
  }
  .live-corner-badge{
    position:absolute; top:0; left:0; background:#ef4444; color:#fff;
    font-weight:800; font-size:11px; padding:5px 12px;
    border-top-left-radius:var(--radius); border-bottom-right-radius:10px;
    text-transform:uppercase; letter-spacing:0.08em;
  }
  .live-game-content{
    display:flex; flex-direction:column;
    width:100%; gap:16px; padding-top:8px;
  }
  .live-game-top{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .live-game-champ{ display:flex; align-items:center; gap:12px; }
  .live-game-champ img{ width:52px; height:52px; border-radius:12px; border:2px solid var(--accent-soft); object-fit:cover; background:#1d1d24; }
  .live-game-champ span{ font-weight:800; font-size:17px; color:#fff; }
  .live-game-spells{ display:flex; gap:8px; }
  .live-game-spells img{ width:36px; height:36px; border-radius:8px; border:1px solid var(--border); background:#1d1d24; }
  .live-game-meta{ display:flex; gap:10px; flex-wrap:wrap; }
  .live-game-side{ font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:0.06em; padding:7px 16px; border-radius:8px; }
  .live-game-side.side-blue{ color:#60a5fa; background:rgba(96,165,250,.12); border:1px solid rgba(96,165,250,.3); }
  .live-game-side.side-red{ color:#f87171; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.3); }

  /* Bloque de dúo dentro de "En partida" — nombre + campeón + hechizos del compañero */
  .live-game-duo-box{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:rgba(139,92,246,.08); border:1px solid rgba(139,92,246,.3);
    border-radius:12px; padding:12px 16px;
  }
  .live-game-duo-label{ font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-soft); white-space:nowrap; }
  .live-game-duo-player{ display:flex; align-items:center; gap:10px; flex:1; min-width:220px; }
  .live-game-duo-player img.duo-champ-img{ width:40px; height:40px; border-radius:10px; border:2px solid var(--accent-soft); object-fit:cover; background:#1d1d24; }
  .live-game-duo-info{ display:flex; flex-direction:column; line-height:1.35; }
  .live-game-duo-name{ font-weight:800; font-size:14px; color:#fff; }
  .live-game-duo-champ{ font-weight:600; font-size:12px; color:var(--text-dim); }
  .live-game-duo-spells{ display:flex; gap:6px; margin-left:auto; }
  .live-game-duo-spells img{ width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:#1d1d24; }

  /* BADGES / LOGROS */
  .badges-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 28px;
  }
  .badge-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    transition: border-color 150ms ease;
  }
  .badge-chip.gold   { border-color: rgba(251,191,36,.5);  background: rgba(251,191,36,.08); color: #fbbf24; }
  .badge-chip.green  { border-color: rgba(52,211,153,.5);  background: rgba(52,211,153,.08); color: #34d399; }
  .badge-chip.purple { border-color: rgba(139,92,246,.5);  background: rgba(139,92,246,.08); color: #a78bfa; }
  .badge-chip.red    { border-color: rgba(239,68,68,.5);   background: rgba(239,68,68,.08);  color: #f87171; }
  .badge-chip.blue   { border-color: rgba(96,165,250,.5);  background: rgba(96,165,250,.08); color: #60a5fa; }
  .badge-chip-icon   { font-size: 15px; line-height: 1; }

  /* MODO DE JUEGO — badge nuevo */
  .live-game-mode{
    font-weight:700; font-size:12px; padding:6px 14px; border-radius:8px;
    background:rgba(139,92,246,.15); border:1px solid rgba(139,92,246,.35);
    color:var(--accent-soft); letter-spacing:0.04em; text-transform:uppercase;
  }

  /* GRID STATS */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:20px; margin-bottom:40px; }
  .stat-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
  .stat-card h3 { margin:0 0 16px 0; font-size:14px; text-transform:uppercase; color:var(--text-faint); font-weight:700; border-bottom:1px solid var(--border); padding-bottom:10px; }
  
  .list-item { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .list-item:last-child { margin-bottom:0; }
  .champ-img { width:40px; height:40px; border-radius:8px; object-fit:cover; background:#1d1d24; }
  .item-title { font-weight:700; font-size:14px; }
  .item-sub { font-size:12px; color:var(--text-dim); }

  /* HISTORIAL */
  .history-section h3 { font-size:18px; font-weight:800; margin-bottom:16px; }
  .matches{ display:flex; flex-direction:column; gap:8px; }
  .match{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px; padding:12px 16px; border-radius:12px; background:var(--panel); border:1px solid var(--border); }
  a.match{ text-decoration:none; color:inherit; cursor:pointer; transition:border-color .15s ease; }
  a.match:hover{ border-color:var(--accent-soft); }
  .match-icons{ display:flex; align-items:center; gap:6px; }
  .match-champ-img { width:48px; height:48px; border-radius:10px; }
  .match-spells{ display:flex; flex-direction:column; gap:3px; }
  .match-spells img{ width:20px; height:20px; border-radius:4px; border:1px solid var(--border); background:#1d1d24; }
  .match-champ{ font-size:15px; font-weight:700; color:#ffffff; }
  .match-kda{ font-size:13px; color:var(--text-faint); margin-top:3px; }
  .match-duo{ font-size:12px; font-weight:700; color:var(--accent-soft); margin-top:3px; }
  .result-chip{ font-size:12px; font-weight:800; padding:6px 14px; border-radius:99px; text-transform:uppercase; text-align:center; }
  .result-chip.victoria{ color:var(--win); background:var(--win-bg); border:1px solid rgba(52,211,153,.3); }
  .result-chip.derrota{ color:var(--loss); background:var(--loss-bg); border:1px solid rgba(248,113,113,.3); }
  .result-chip.remake{ color:#a1a1aa; background:rgba(161,161,170,.1); border:1px solid rgba(161,161,170,.2); }
  .match-result-block{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .lp-change{ font-size:11px; font-weight:800; }
  .lp-change.win{ color:var(--win); }
  .lp-change.loss{ color:var(--loss); }

  #error-msg { text-align:center; padding:50px; color:var(--loss); font-weight:bold; display:none; }

  /* GRÁFICA LP */
  .lp-chart-section { margin-top:32px; }
  .lp-chart-section h3 { font-size:18px; font-weight:800; margin-bottom:16px; }
  .lp-chart-wrap {
    background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:20px 20px 14px;
  }
  .lp-chart-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .lp-chart-header .lp-label {
    font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; color:var(--text-faint);
  }
  .lp-chart-header .lp-delta {
    font-size:13px; font-weight:800;
  }
  .lp-chart-header .lp-delta.up   { color:var(--win); }
  .lp-chart-header .lp-delta.down { color:var(--loss); }
  .lp-chart-header .lp-delta.flat { color:var(--text-faint); }
  #lp-canvas { display:block; width:100%; height:90px; }
  .lp-chart-footer {
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--text-faint); margin-top:6px;
  }

  /* Menú flotante desplegable — un botón, se abre en burbujas hacia arriba */
  .fab-menu{ position:fixed; right:28px; bottom:28px; z-index:999; display:flex; flex-direction:column; align-items:flex-end; gap:14px; }
  .fab-main{
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:26px; font-weight:400; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 24px rgba(139,92,246,.55);
    transition:transform .25s ease, box-shadow .2s ease;
  }
  .fab-main:hover{ box-shadow:0 6px 32px rgba(139,92,246,.75); }
  .fab-menu.open .fab-main{ transform:rotate(45deg); }
  .fab-options{ display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
  .fab-option{
    display:flex; align-items:center; gap:10px; text-decoration:none;
    opacity:0; transform:translateY(10px) scale(.85); pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .fab-menu.open .fab-option{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .fab-menu.open .fab-option:nth-child(1){ transition-delay:.09s; }
  .fab-menu.open .fab-option:nth-child(2){ transition-delay:.06s; }
  .fab-menu.open .fab-option:nth-child(3){ transition-delay:.03s; }
  .fab-option-icon{
    width:46px; height:46px; border-radius:50%; background:var(--panel-2);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:0 4px 16px rgba(0,0,0,.45); flex-shrink:0;
  }
  .fab-option-label{
    font-size:12px; font-weight:700; color:var(--text); background:var(--panel-2);
    padding:5px 10px; border-radius:8px; border:1px solid var(--border);
    white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
</style>
</head>

</div>

<div class="fab-menu" id="fabMenu">
  <div class="fab-options">
    <a class="fab-option" href="campeones.html">
      <span class="fab-option-label">Campeones</span>
      <span class="fab-option-icon">🏆</span>
    </a>
    <a class="fab-option" href="versus.html">
      <span class="fab-option-label">Versus</span>
      <span class="fab-option-icon">⚔️</span>
    </a>
    <a class="fab-option" href="index.html">
      <span class="fab-option-label">Inicio</span>
      <span class="fab-option-icon">🏠</span>
    </a>
  </div>
  <button class="fab-main" id="fabMainBtn" type="button" aria-label="Menú de navegación" title="Menú">+</button>
</div>
<script>
(function(){
  var menu = document.getElementById('fabMenu');
  var btn  = document.getElementById('fabMainBtn');
  if(!menu || !btn) return;
  btn.addEventListener('click', function(e){ e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('click', function(e){ if(menu.classList.contains('open') && !menu.contains(e.target)) menu.classList.remove('open'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') menu.classList.remove('open'); });
})();
</script>

<script>
window.addEventListener('load', () => {
  const params    = new URLSearchParams(window.location.search);
  const jugadorId = params.get('jugador');

  // FIX: raw.githubusercontent.com en vez de jsDelivr — más confiable y sin caché de horas.
  const CDN        = 'https://raw.githubusercontent.com/KyoSharkCode/SoloQApuesta/main';
  const REFRESH_MS = 15000;
  let lastUpdate   = null;
  let loadedOnce   = false;
  let lastProgreso = [];

  window.addEventListener('resize', () => {
    requestAnimationFrame(() => renderLpChart(lastProgreso));
  });

  const liveIndicatorTextEl = document.getElementById('live-indicator-text');

  if (!jugadorId) {
    document.getElementById('error-msg').style.display = 'block';
    return;
  }

  init();

  function init(){
    refreshAll();
    setInterval(refreshAll, REFRESH_MS);
    setInterval(tickLiveIndicator, 1000);
    document.addEventListener('visibilitychange', () => {
      if(!document.hidden) refreshAll();
    });
  }

  async function refreshAll(){
    await Promise.all([ loadProfileData(), checkLiveStatus() ]);
    lastUpdate = Date.now();
    tickLiveIndicator();
  }

  function tickLiveIndicator(){
    if(!liveIndicatorTextEl) return;
    if(!lastUpdate){ liveIndicatorTextEl.textContent = 'Cargando…'; return; }
    const secs = Math.floor((Date.now() - lastUpdate) / 1000);
    if(secs < 5)      liveIndicatorTextEl.textContent = 'Actualizado ahora';
    else if(secs < 60) liveIndicatorTextEl.textContent = `Actualizado hace ${secs}s`;
    else              liveIndicatorTextEl.textContent = `Actualizado hace ${Math.floor(secs/60)}m`;
  }

  function renderBadges(p, todos, reyTemporada) {
    const badgesEl = document.getElementById('badges-row');
    const badges   = [];

    const TIER_ORDER = ['IRON','BRONZE','SILVER','GOLD','PLATINUM','EMERALD','DIAMOND','MASTER','GRANDMASTER','CHALLENGER'];
    const DIV_NUM    = { 'IV':0,'III':1,'II':2,'I':3 };
    const DIVISIONLESS = ['MASTER','GRANDMASTER','CHALLENGER'];
    const MASTER_BASE  = 7 * 4 * 100;

    function eloScore(rango, div, lp) {
      const tier = (rango || '').toUpperCase();
      const ti   = TIER_ORDER.indexOf(tier);
      if (ti === -1) return -1;
      if (DIVISIONLESS.includes(tier)) return MASTER_BASE + Math.max(0, lp || 0);
      const dn = DIV_NUM[(div || '').toUpperCase()];
      if (dn === undefined) return -1;
      return (ti * 4 + dn) * 100 + Math.max(0, Math.min(100, lp || 0));
    }

    const rankParts   = (p.rango || 'Unranked').split(' ');
    const pRango      = rankParts[0];
    const pDiv        = rankParts.slice(1).join(' ');
    const pScore      = eloScore(pRango, pDiv, p.lp || 0);
    const pKills          = p.kills_recientes || 0;
    const pPenta          = p.pentakills_recientes || 0;
    const pVision         = p.vision_promedio_reciente || 0;
    const pPrimSangre     = p.primeras_sangre_semana || 0;
    const pKdaProm        = p.kda_promedio_semana || 0;
    const pKdaPerf        = !!p.kda_perfecto_semana;
    const pChampsGan      = p.campeones_ganados_semana || 0;
    const pHistorial      = p.historial || [];
    const pHistLP         = p.progreso_lp || [];
    const pAsistencias    = p.asistencias_semana || 0;
    const pPartidasSemana = p.partidas_semana || 0;
    const pMaxDia         = p.max_partidas_en_un_dia || 0;
    const pPrimVictoria   = p.primera_victoria_hoy || null;
    const pDuoSemana      = p.duo_semana || null;

    // Calcular estadísticas de todos para comparar
    const ONE_WEEK = 7 * 24 * 60 * 60 * 1000;
    const now      = Date.now();

    let maxScore = -Infinity, maxKills = -1, maxPenta = -1, maxVision = -1;
    let maxClimb = -Infinity, pClimb = -Infinity;
    let maxChampPct = -1;
    let pChampPct   = 0;
    let pTopChamp   = '';
    let maxPrimSangre = -1, maxKdaProm = -1, maxChampsGan = -1;
    let maxAsistencias = -1, minPartidasSemana = Infinity, maxDia = -1;

    // ordenar jugadores por score para saber si es top1/2/3
    const sortedByScore = [...todos].sort((a, b) => {
      const ra = (a.rango || 'Unranked').split(' ');
      const rb = (b.rango || 'Unranked').split(' ');
      return eloScore(rb[0], rb.slice(1).join(' '), b.lp || 0) - eloScore(ra[0], ra.slice(1).join(' '), a.lp || 0);
    });
    const rankPosition = sortedByScore.findIndex(j => j.nombre === p.nombre) + 1; // 1-based

    todos.forEach(j => {
      const rp   = (j.rango || 'Unranked').split(' ');
      const sc   = eloScore(rp[0], rp.slice(1).join(' '), j.lp || 0);
      if (sc > maxScore) maxScore = sc;
      if ((j.kills_recientes || 0) > maxKills)            maxKills  = j.kills_recientes || 0;
      if ((j.pentakills_recientes || 0) > maxPenta)       maxPenta  = j.pentakills_recientes || 0;
      if ((j.vision_promedio_reciente || 0) > maxVision)  maxVision = j.vision_promedio_reciente || 0;
      if ((j.primeras_sangre_semana || 0) > maxPrimSangre) maxPrimSangre = j.primeras_sangre_semana || 0;
      if ((j.kda_promedio_semana || 0) > maxKdaProm)  maxKdaProm   = j.kda_promedio_semana || 0;
      if ((j.campeones_ganados_semana || 0) > maxChampsGan) maxChampsGan = j.campeones_ganados_semana || 0;
      if ((j.asistencias_semana || 0) > maxAsistencias) maxAsistencias = j.asistencias_semana || 0;
      if ((j.partidas_semana || 0) > 0 && (j.partidas_semana || 0) < minPartidasSemana) minPartidasSemana = j.partidas_semana;
      if ((j.max_partidas_en_un_dia || 0) > maxDia) maxDia = j.max_partidas_en_un_dia || 0;

      // Escalador: LP ganados esta semana
      const hist = (j.progreso_lp || []).filter(pt => pt.fecha && now - new Date(pt.fecha).getTime() <= ONE_WEEK)
                    .sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
      if (hist.length > 0) {
        const curSc   = eloScore(rp[0], rp.slice(1).join(' '), j.lp || 0);
        const firstSc = eloScore(hist[0].rango || rp[0], hist[0].division || rp.slice(1).join(' '), hist[0].lp || 0);
        const diff    = curSc - firstSc;
        if (diff > maxClimb) maxClimb = diff;
        if (j.nombre === p.nombre) pClimb = diff;
      }

      // OTP
      if (j.historial && j.historial.length > 0) {
        const cc = {};
        j.historial.forEach(m => { cc[m.campeon] = (cc[m.campeon] || 0) + 1; });
        const top = Object.entries(cc).sort((a,b) => b[1]-a[1])[0];
        if (top) {
          const pct = Math.round(top[1] / j.historial.length * 100);
          if (pct > maxChampPct) maxChampPct = pct;
          if (j.nombre === p.nombre) { pChampPct = pct; pTopChamp = top[0]; }
        }
      }
    });

    // ── Evaluar badges para este jugador ──

    // Rey de la Temporada — distinto de "Top 1 del Torneo" de abajo (que es
    // la posición AHORA): esto es quién acumula más días TOTALES en el
    // puesto #1 a lo largo de toda la temporada. Lo calcula el bot.
    if (reyTemporada && reyTemporada.jugador === p.nombre.split('#')[0])
      badges.push({ icon:'👑', label:`Rey de la Temporada · ${reyTemporada.dias} día${reyTemporada.dias === 1 ? '' : 's'} en el Top 1`, color:'gold' });

    // Top 1 / 2 / 3 ranking
    if (rankPosition === 1 && pScore > -1)
      badges.push({ icon:'🥇', label:'Top 1 del Torneo', color:'gold' });
    else if (rankPosition === 2 && pScore > -1)
      badges.push({ icon:'🥈', label:'Top 2 del Torneo', color:'blue' });
    else if (rankPosition === 3 && pScore > -1)
      badges.push({ icon:'🥉', label:'Top 3 del Torneo', color:'purple' });

    // Top Asesino (semana)
    if (pKills > 0 && pKills >= maxKills)
      badges.push({ icon:'⚔️', label:`Top Asesino · ${pKills} kills`, color:'red' });

    // Top Pentakills (semana)
    if (pPenta > 0 && pPenta >= maxPenta)
      badges.push({ icon:'🔥', label:`Top Pentakills · ${pPenta} pentas`, color:'red' });

    // Top Observador (semana)
    if (pVision > 0 && pVision >= maxVision)
      badges.push({ icon:'👁️', label:`Top Observador · ${pVision} visión`, color:'blue' });

    // El Escalador (mejor escalada esta semana)
    if (pClimb > 0 && pClimb >= maxClimb)
      badges.push({ icon:'📈', label:'El Escalador · Mejor semana', color:'green' });

    // OTP
    if (pChampPct >= 60)
      badges.push({ icon:'🎯', label:`OTP · ${pTopChamp} (${pChampPct}%)`, color:'purple' });

    // Agresivo (más primeras sangres esta semana)
    if (pPrimSangre > 0 && pPrimSangre >= maxPrimSangre)
      badges.push({ icon:'🩸', label:`Agresivo · ${pPrimSangre} primera${pPrimSangre === 1 ? '' : 's'} sangre`, color:'red' });

    // KDA Player (mejor KDA promedio esta semana)
    if (pKdaProm > 0 && pKdaProm >= maxKdaProm)
      badges.push({ icon:'📊', label: pKdaPerf ? 'KDA Player · Perfect KDA' : `KDA Player · ${pKdaProm} KDA prom.`, color:'green' });

    // Maestro del Champion Pool (más campeones distintos ganados esta semana)
    if (pChampsGan > 0 && pChampsGan >= maxChampsGan)
      badges.push({ icon:'🎭', label:`Maestro del Pool · ${pChampsGan} campeones ganados`, color:'purple' });

    // El Tortuga — menos partidas de todos esta semana
    if (pPartidasSemana > 0 && pPartidasSemana <= minPartidasSemana)
      badges.push({ icon:'🐢', label:`El Tortuga · ${pPartidasSemana} partida${pPartidasSemana === 1 ? '' : 's'} esta semana`, color:'blue' });

    // El Asistente — más asistencias de todos esta semana
    if (pAsistencias > 0 && pAsistencias >= maxAsistencias)
      badges.push({ icon:'🤝', label:`El Asistente · ${pAsistencias} asistencias`, color:'green' });

    // Sin rendirse — más partidas en un solo día (mínimo 3)
    if (pMaxDia >= 3 && pMaxDia >= maxDia)
      badges.push({ icon:'😤', label:`Sin rendirse · ${pMaxDia} partidas en un día`, color:'purple' });

    // Dúo más frecuente de la semana
    if (pDuoSemana && pDuoSemana.nombre && pDuoSemana.partidas > 0)
      badges.push({ icon:'🎮', label:`Dúo Frecuente · ${pDuoSemana.nombre} (${pDuoSemana.partidas} partida${pDuoSemana.partidas === 1 ? '' : 's'} juntos)`, color:'blue' });

    // Primera victoria del día — FIX: es objeto con .timestamp (ms)
    if (pPrimVictoria && typeof pPrimVictoria === 'object' && pPrimVictoria.timestamp) {
      const hora = new Date(pPrimVictoria.timestamp).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
      badges.push({ icon:'🌅', label:`Primera Victoria del Día · ${hora}h`, color:'gold' });
    }

    // Racha de victorias
    let streak = 0;
    for (const m of pHistorial) {
      if ((m.resultado || '').toLowerCase() === 'victoria') streak++;
      else break;
    }
    if (streak >= 3)
      badges.push({ icon:'🔥', label:`Racha de ${streak} victorias`, color:'green' });

    // Racha de derrotas
    let loseStreak = 0;
    for (const m of pHistorial) {
      if ((m.resultado || '').toLowerCase() === 'derrota') loseStreak++;
      else break;
    }
    if (loseStreak >= 3)
      badges.push({ icon:'❄️', label:`Racha fría · ${loseStreak} derrotas`, color:'blue' });

    if (badges.length === 0) {
      badgesEl.style.display = 'none';
      return;
    }

    badgesEl.innerHTML = badges.map(b => `
      <div class="badge-chip ${b.color}">
        <span class="badge-chip-icon">${b.icon}</span>
        <span>${b.label}</span>
      </div>`).join('');
  }

  async function checkLiveStatus() {

    try {
      const liveRes = await fetch(`${CDN}/live_data.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!liveRes.ok) return;
      const liveData   = await liveRes.json();
      const liveStatus = liveData[jugadorId];

      if (liveStatus && liveStatus.en_partida) {
        const esAzul     = liveStatus.equipo === 'blue';
        const ladoTexto  = esAzul ? 'Lado Azul' : 'Lado Rojo';
        const ladoClase  = esAzul ? 'side-blue' : 'side-red';
        const campeon    = liveStatus.campeon || 'Desconocido';
        const modoJuego  = liveStatus.modo_juego || 'Partida';
        const champUrl   = liveStatus.campeon
          ? `https://ddragon.leagueoflegends.com/cdn/16.16.1/img/champion/${liveStatus.campeon.replace(/[^a-zA-Z0-9]/g,'')}.png`
          : '';
        const hechizosHtml = (liveStatus.hechizos || []).map(h => `
          <img src="https://ddragon.leagueoflegends.com/cdn/16.16.1/img/spell/${h.icono}"
               title="${h.nombre}" alt="${h.nombre}"
               onerror="this.style.visibility='hidden'">
        `).join('');

        // Dúo — nombre + campeón + hechizos del compañero (duo_detalle).
        // Fallback a duo_con (solo nombres) por si live_data.json todavía
        // no se ha regenerado con el dato nuevo.
        const duoDetalle = Array.isArray(liveStatus.duo_detalle) && liveStatus.duo_detalle.length
          ? liveStatus.duo_detalle
          : (Array.isArray(liveStatus.duo_con) ? liveStatus.duo_con.map(n => ({ nombre: n })) : []);

        const duoHtml = duoDetalle.length ? `
          <div class="live-game-duo-box">
            <span class="live-game-duo-label">🎮 Dúo con</span>
            ${duoDetalle.map(d => {
              const duoChampUrl = d.campeon
                ? `https://ddragon.leagueoflegends.com/cdn/16.16.1/img/champion/${d.campeon.replace(/[^a-zA-Z0-9]/g,'')}.png`
                : '';
              const duoSpellsHtml = (d.hechizos || []).map(h => `
                <img src="https://ddragon.leagueoflegends.com/cdn/16.16.1/img/spell/${h.icono}"
                     title="${h.nombre}" alt="${h.nombre}"
                     onerror="this.style.visibility='hidden'">
              `).join('');
              return `
                <div class="live-game-duo-player">
                  <img class="duo-champ-img" src="${duoChampUrl}" alt="${d.campeon||''}" onerror="this.style.visibility='hidden'">
                  <div class="live-game-duo-info">
                    <span class="live-game-duo-name">${d.nombre}</span>
                    <span class="live-game-duo-champ">${d.campeon || 'Desconocido'}</span>
                  </div>
                  <div class="live-game-duo-spells">${duoSpellsHtml}</div>
                </div>`;
            }).join('')}
          </div>` : '';

        box.className = 'live-status-box in-game';
        box.innerHTML = `
          <span class="live-corner-badge">En Partida</span>
          <div class="live-game-content">
            <div class="live-game-top">
              <div class="live-game-champ">
                <img src="${champUrl}" alt="${campeon}" onerror="this.style.visibility='hidden'">
                <span>${campeon}</span>
              </div>
              <div class="live-game-spells">${hechizosHtml}</div>
            </div>
            ${duoHtml}
            <div class="live-game-meta">
              <div class="live-game-mode">${modoJuego}</div>
              <div class="live-game-side ${ladoClase}">${ladoTexto}</div>
            </div>
          </div>
        `;
      } else {
        box.className = 'live-status-box offline';
        box.innerHTML = `<span class="live-offline-text">Offline</span>`;
      }
    } catch (e) {
      console.log("Error verificando estado en vivo:", e);
    }
  }

              <img class="champ-img" src="https://ddragon.leagueoflegends.com/cdn/16.16.1/img/champion/${fmt(c.campeon)}.png" onerror="this.style.visibility='hidden'">
              <div>
                <div class="item-title">${c.campeon}</div>
                <div class="item-sub">${c.cantidad} partidas recientes</div>
              </div>
            </div>`).join('')
        : '<span class="item-sub">No ha jugado recientemente.</span>';

      // Roles
      const boxRoles = document.getElementById('box-roles');
      boxRoles.innerHTML = (p.top_roles && p.top_roles.length)
        ? p.top_roles.map(r => `
            <div class="list-item">
              <div class="champ-img" style="display:flex;align-items:center;justify-content:center;background:rgba(139,92,246,0.2);color:#a78bfa;font-weight:bold;font-size:20px;">✦</div>
              <div>
                <div class="item-title">${r.rol}</div>
                <div class="item-sub">${r.cantidad} veces jugado</div>
              </div>

              `<img src="https://ddragon.leagueoflegends.com/cdn/16.16.1/img/spell/${s}.png" title="${s}" onerror="this.style.display='none'">`
            ).join('');
            const duoCon = Array.isArray(h.duo_con) ? h.duo_con : [];
            const tag      = h.match_id ? 'a' : 'div';
            const hrefAttr = h.match_id ? `href="partida.html?match_id=${encodeURIComponent(h.match_id)}&jugador=${encodeURIComponent(jugadorId)}"` : '';
            return `
            <${tag} class="match" ${hrefAttr}>
              <span class="match-icons">
                <img class="match-champ-img" src="https://ddragon.leagueoflegends.com/cdn/16.16.1/img/champion/${fmt(h.campeon)}.png" onerror="this.style.visibility='hidden'">

              <div>

              </div>

                <span class="result-chip ${h.resultado.toLowerCase()}">${h.resultado}</span>

      // Cargar todos los jugadores para comparar badges
      renderBadges(p, jugadores, data.rey_temporada);

      // Gráfica LP — espera un frame para que el layout esté listo
      lastProgreso = p.progreso_lp || [];
      requestAnimationFrame(() => renderLpChart(lastProgreso));

      document.getElementById('profile-content').style.display = 'block';
      document.getElementById('error-msg').style.display       = 'none';
      loadedOnce = true;

    } catch (error) {
      if(!loadedOnce){
        document.getElementById('error-msg').style.display = 'block';
      }
      console.error(error);
    }
  }

  function renderLpChart(progreso_lp) {
    const TIER_ORDER   = ['IRON','BRONZE','SILVER','GOLD','PLATINUM','EMERALD','DIAMOND','MASTER','GRANDMASTER','CHALLENGER'];
    const DIVISIONLESS = ['MASTER','GRANDMASTER','CHALLENGER'];
    const DIV_NUM      = {'IV':0,'III':1,'II':2,'I':3};
    const MASTER_BASE  = 7*4*100;

    function eloScore(rango, division, lp) {
      const tier = (rango||'').toUpperCase();
      const ti   = TIER_ORDER.indexOf(tier);
      if (ti === -1) return null;
      if (DIVISIONLESS.includes(tier)) return MASTER_BASE + Math.max(0, lp||0);
      const dn = DIV_NUM[(division||'').toUpperCase()];
      if (dn === undefined) return null;
      return (ti*4+dn)*100 + Math.max(0, Math.min(100, lp||0));
    }

    // Filtrar últimos 7 días
    const now     = Date.now();
    const semana  = 7 * 24 * 60 * 60 * 1000;
    const puntos  = (progreso_lp || [])
      .filter(pt => pt.fecha && (now - new Date(pt.fecha).getTime()) <= semana)
      .sort((a, b) => new Date(a.fecha) - new Date(b.fecha))
      .map(pt => ({
        fecha: new Date(pt.fecha),
        score: eloScore(pt.rango, pt.division, pt.lp),
        lp:    pt.lp,
        rango: pt.rango,
        div:   pt.division,
      }))
      .filter(pt => pt.score !== null);

    const section = document.getElementById('lp-chart-section');
    if (puntos.length < 2) { section.style.display = 'none'; return; }
    section.style.display = 'block';

    // Delta total
    const first = puntos[0].score;
    const last  = puntos[puntos.length - 1].score;
    const delta = last - first;
    const deltaEl = document.getElementById('lp-delta');
    if (delta > 0)       { deltaEl.textContent = `+${delta} LP`; deltaEl.className = 'lp-delta up'; }
    else if (delta < 0)  { deltaEl.textContent = `${delta} LP`;  deltaEl.className = 'lp-delta down'; }
    else                 { deltaEl.textContent = `Sin cambio`;    deltaEl.className = 'lp-delta flat'; }

    // Fechas en footer
    const fmtDate = d => `${d.getDate()}/${d.getMonth()+1}`;
    document.getElementById('lp-date-start').textContent = fmtDate(puntos[0].fecha);
    document.getElementById('lp-date-end').textContent   = fmtDate(puntos[puntos.length-1].fecha);
    document.getElementById('lp-range-label').textContent =
      `${puntos[0].rango} ${puntos[0].div||''} → ${puntos[puntos.length-1].rango} ${puntos[puntos.length-1].div||''}`.trim();

    // Dibujar canvas
    const canvas  = document.getElementById('lp-canvas');
    const dpr     = window.devicePixelRatio || 1;
    const W       = canvas.parentElement.clientWidth - 40; // padding 20px c/lado
    const H       = 90;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const scores = puntos.map(p => p.score);
    const minS   = Math.min(...scores);
    const maxS   = Math.max(...scores);
    const rangeS = maxS - minS || 1;

    const PAD_X = 4, PAD_Y = 8;
    const toX   = i => PAD_X + (i / (puntos.length - 1)) * (W - PAD_X * 2);
    const toY   = s => PAD_Y + (1 - (s - minS) / rangeS) * (H - PAD_Y * 2);

    // Gradiente de relleno bajo la línea
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(139,92,246,0.25)');
    grad.addColorStop(1, 'rgba(139,92,246,0)');

    ctx.beginPath();
    ctx.moveTo(toX(0), toY(scores[0]));
    for (let i = 1; i < scores.length; i++) ctx.lineTo(toX(i), toY(scores[i]));
    ctx.lineTo(toX(scores.length - 1), H);
    ctx.lineTo(toX(0), H);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Línea principal
    ctx.beginPath();
    ctx.moveTo(toX(0), toY(scores[0]));
    for (let i = 1; i < scores.length; i++) ctx.lineTo(toX(i), toY(scores[i]));
    ctx.strokeStyle = '#8b5cf6';
    ctx.lineWidth   = 2;
    ctx.lineJoin    = 'round';
    ctx.stroke();

    // Punto final destacado
    const lastX = toX(scores.length - 1);
    const lastY = toY(scores[scores.length - 1]);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#a78bfa';
    ctx.fill();
    ctx.strokeStyle = '#0a0a0c';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
});
</script>
</body>
</html>
