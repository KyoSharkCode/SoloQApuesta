<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil del Jugador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --panel:#131317; --panel-2:#18181d;
    --border:#232329; --text:#ffffff; --text-dim:#9a9aa3;
    --text-faint:#a1a1aa; --accent:#8b5cf6; --accent-soft:#a78bfa;
    --win:#34d399; --win-bg:rgba(52,211,153,.12);
    --loss:#f87171; --loss-bg:rgba(248,113,113,.12);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: radial-gradient(800px 400px at 50% 0%, rgba(139,92,246,.15), transparent), var(--bg);
    color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:40px 20px 80px; }
  
  .back-btn { display: inline-flex; align-items: center; color: var(--accent-soft); text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 30px; transition: color 0.2s; }
  .back-btn:hover { color: #ffffff; }

  /* HEADER PERFIL */
  .profile-header { display: flex; align-items: center; gap: 24px; padding-bottom: 30px; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
  .profile-avatar { width: 100px; height: 100px; border-radius: 20px; border: 3px solid var(--accent); object-fit: cover; }
  .profile-info h1 { margin: 0 0 5px 0; font-size: 32px; font-weight: 900; }
  .profile-info p { margin: 0; color: var(--text-faint); font-size: 16px; font-weight: 500; }
  .profile-rank { margin-left: auto; text-align: right; }
  .profile-rank h2 { margin: 0; font-size: 28px; color: #fbbf24; font-weight: 800; }
  .profile-rank span { color: var(--text-faint); font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;}

  /* PARTIDA EN VIVO */
  .live-game-box { background: var(--panel); border: 1px solid rgba(248,113,113,0.4); border-radius: var(--radius); padding: 20px; margin-bottom: 40px; box-shadow: 0 0 15px rgba(248,113,113,0.1); }
  .live-game-box h3 { color: #f87171; margin-top: 0; text-align: center; font-weight: 900; font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .live-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .team-blue h4 { color: #3b82f6; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-top: 0; text-transform: uppercase; font-size: 13px; }
  .team-red h4 { color: #ef4444; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-top: 0; text-transform: uppercase; font-size: 13px; }
  .live-player { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .live-player:last-child { margin-bottom: 0; }
  .live-champ { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); background: #1d1d24; }
  .live-spells { display: flex; flex-direction: column; gap: 2px; }
  .live-spells img { width: 17px; height: 17px; border-radius: 4px; object-fit: cover; }
  .live-info { display: flex; flex-direction: column; overflow: hidden; }
  .live-name { font-weight: 700; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live-champ-name { font-size: 11px; color: var(--text-dim); }

  /* GRID DE ESTADÍSTICAS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .stat-card h3 { margin: 0 0 16px 0; font-size: 14px; text-transform: uppercase; color: var(--text-faint); font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
  
  .list-item { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .list-item:last-child { margin-bottom: 0; }
  .champ-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #1d1d24; }
  .item-title { font-weight: 700; font-size: 14px; }
  .item-sub { font-size: 12px; color: var(--text-dim); }
  
  /* HISTORIAL */
  .history-section h3 { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
  .matches{ display:flex; flex-direction:column; gap:8px; }
  .match{ display:grid; grid-template-columns:48px 1fr auto; align-items:center; gap:14px; padding:12px 16px; border-radius:12px; background:var(--panel); border:1px solid var(--border); }
  .match-champ-img { width: 48px; height: 48px; border-radius: 10px; }
  .match-champ{ font-size:15px; font-weight:700; color: #ffffff;}
  .match-kda{ font-size:13px; color:var(--text-faint); margin-top: 3px;}
  .result-chip{ font-size:12px; font-weight:800; padding:6px 14px; border-radius:99px; text-transform:uppercase; text-align: center; }
  .result-chip.victoria{ color:var(--win); background:var(--win-bg); border: 1px solid rgba(52,211,153,.3); }
  .result-chip.derrota{ color:var(--loss); background:var(--loss-bg); border: 1px solid rgba(248,113,113,.3); }

  #error-msg { text-align: center; padding: 50px; color: var(--loss); font-weight: bold; display: none;}
</style>
</head>
<body>

<div class="wrap">
  <a href="index.html" class="back-btn">← Volver al Ranking</a>

  <div id="error-msg">Jugador no encontrado.</div>

  <div id="profile-content" style="display: none;">
    <div class="profile-header">
      <img id="p-avatar" class="profile-avatar" src="" alt="Avatar">
      <div class="profile-info">
        <h1 id="p-name">Cargando...</h1>
        <p id="p-winrate">Winrate</p>
      </div>
      <div class="profile-rank">
        <h2 id="p-lp">0 LP</h2>
        <span id="p-tier">Rango</span>
      </div>
    </div>

    <!-- CONTENEDOR DE PARTIDA EN VIVO -->
    <div id="partida-en-vivo-container"></div>

    <div class="stats-grid">
      <!-- Top 3 Maestrías -->
      <div class="stat-card">
        <h3>Top 3 Maestrías</h3>
        <div id="box-mastery"></div>
      </div>
      
      <!-- Top 3 Campeones (10 partidas) -->
      <div class="stat-card">
        <h3>Top Campeones (SoloQ)</h3>
        <div id="box-champs"></div>
      </div>

      <!-- Top Roles -->
      <div class="stat-card">
        <h3>Roles Más Jugados</h3>
        <div id="box-roles"></div>
      </div>
    </div>

    <div class="history-section">
      <h3>Últimas Partidas (Solo/Duo)</h3>
      <div class="matches" id="box-history"></div>
    </div>
  </div>
</div>

<script>
window.addEventListener('load', async () => {
  const params = new URLSearchParams(window.location.search);
  const jugadorId = params.get('jugador');

  if (!jugadorId) {
    document.getElementById('error-msg').style.display = 'block';
    return;
  }

  try {
    const res = await fetch('datos.json', { cache: 'no-store' });
    const data = await res.json();
    const jugadores = Array.isArray(data) ? data : (data.jugadores || []);
    
    const p = jugadores.find(j => j.nombre === jugadorId);
    
    if (!p) throw new Error("No encontrado");

    const formatImg = (name) => name.replace(/[^a-zA-Z0-9]/g,'');

    // HEADER
    document.getElementById('p-avatar').src = `https://ddragon.leagueoflegends.com/cdn/14.20.1/img/profileicon/${p.icono || 1}.png`;
    document.getElementById('p-name').innerText = p.nombre.split('#')[0];
    document.getElementById('p-tier').innerText = p.rango;
    document.getElementById('p-lp').innerText = `${p.lp} LP`;
    document.getElementById('p-winrate').innerText = `Tasa de victoria global: ${p.winrate}`;

    // PARTIDA EN VIVO (Si está jugando)
    const liveContainer = document.getElementById('partida-en-vivo-container');
    if (p.en_partida && p.datos_partida) {
      const blueTeam = p.datos_partida.participantes.filter(x => x.equipo === 'Azul');
      const redTeam = p.datos_partida.participantes.filter(x => x.equipo === 'Rojo');

      const renderPlayer = (player) => `
        <div class="live-player">
          <img class="live-champ" src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${player.campeon_img}.png" alt="${player.campeon_nombre}" onerror="this.style.visibility='hidden'">
          <div class="live-spells">
            <img src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/spell/${player.hechizo1}.png" alt="Hechizo 1" onerror="this.style.visibility='hidden'">
            <img src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/spell/${player.hechizo2}.png" alt="Hechizo 2" onerror="this.style.visibility='hidden'">
          </div>
          <div class="live-info">
            <span class="live-name">${player.nombre.split('#')[0]}</span>
            <span class="live-champ-name">${player.campeon_nombre}</span>
          </div>
        </div>
      `;

      liveContainer.innerHTML = `
        <div class="live-game-box">
          <h3>🔴 En Partida Directa — Modo: ${p.datos_partida.modo}</h3>
          <div class="live-teams">
            <div class="team-blue">
              <h4>Lado Azul</h4>
              ${blueTeam.map(renderPlayer).join('')}
            </div>
            <div class="team-red">
              <h4>Lado Rojo</h4>
              ${redTeam.map(renderPlayer).join('')}
            </div>
          </div>
        </div>
      `;
    } else {
      liveContainer.innerHTML = '';
    }

    // MAESTRÍAS
    const boxMastery = document.getElementById('box-mastery');
    if(p.maestrias && p.maestrias.length > 0) {
      boxMastery.innerHTML = p.maestrias.map(m => `
        <div class="list-item">
          <img class="champ-img" src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${formatImg(m.campeon)}.png" onerror="this.style.visibility='hidden'">
          <div>
            <div class="item-title">${m.campeon}</div>
            <div class="item-sub">Nivel ${m.nivel} • ${m.puntos} pts</div>
          </div>
        </div>
      `).join('');
    } else { boxMastery.innerHTML = '<span class="item-sub">Sin datos</span>'; }

    // CAMPEONES RECIENTES
    const boxChamps = document.getElementById('box-champs');
    if(p.top_recientes && p.top_recientes.length > 0) {
      boxChamps.innerHTML = p.top_recientes.map(c => `
        <div class="list-item">
          <img class="champ-img" src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${formatImg(c.campeon)}.png" onerror="this.style.visibility='hidden'">
          <div>
            <div class="item-title">${c.campeon}</div>
            <div class="item-sub">${c.cantidad} partidas recientes</div>
          </div>
        </div>
      `).join('');
    } else { boxChamps.innerHTML = '<span class="item-sub">No ha jugado recientemente.</span>'; }

    // ROLES RECIENTES
    const boxRoles = document.getElementById('box-roles');
    if(p.top_roles && p.top_roles.length > 0) {
      boxRoles.innerHTML = p.top_roles.map(r => `
        <div class="list-item">
          <div class="champ-img" style="display:flex; align-items:center; justify-content:center; background: rgba(139,92,246,0.2); color: #a78bfa; font-weight:bold; font-size:20px;">
            ✦
          </div>
          <div>
            <div class="item-title">${r.rol}</div>
            <div class="item-sub">${r.cantidad} veces jugado</div>
          </div>
        </div>
      `).join('');
    } else { boxRoles.innerHTML = '<span class="item-sub">Sin roles detectados.</span>'; }

    // HISTORIAL
    const boxHistory = document.getElementById('box-history');
    if(p.historial && p.historial.length > 0) {
      boxHistory.innerHTML = p.historial.map(h => `
        <div class="match">
          <img class="match-champ-img" src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${formatImg(h.campeon)}.png" onerror="this.style.visibility='hidden'">
          <div>
            <div class="match-champ">${h.campeon}</div>
            <div class="match-kda">${h.kda} KDA • ${h.duracion}</div>
          </div>
          <div class="result-chip ${h.resultado.toLowerCase()}">${h.resultado}</div>
        </div>
      `).join('');
    } else { boxHistory.innerHTML = '<p class="item-sub" style="text-align:center;">No hay partidas registradas.</p>'; }

    document.getElementById('profile-content').style.display = 'block';

  } catch (error) {
    document.getElementById('error-msg').style.display = 'block';
    console.error(error);
  }
});
</script>
</body>
</html>
