name: Actualizar Tabla de LoL de forma Automatica

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# NUEVO: evita que dos corridas se ejecuten en paralelo si una tarda más de 5 min
# (duplicaría llamadas a la API de Riot y podría causar conflictos al hacer push)
concurrency:
  group: actualizar-lol
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # NUEVO: evita que un job colgado corra indefinidamente

    steps:

      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos de ranking
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python actualizar_datos.py

      # NUEVO: if: always() -> si el paso anterior falla, este igual se ejecuta.
      # Así el estado "en partida" se sigue actualizando aunque el script pesado truene.
      - name: Actualizar estado en vivo
        if: always()
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python live_status.py

      # NUEVO: if: always() -> guarda lo que sí se haya generado,
      # en vez de perder ambas actualizaciones por el fallo de una sola.
      - name: Guardar cambios en GitHub
        if: always()
        run: |
          git config --global user.name 'RiotBot'
          git config --global user.email 'riotbot@github.com'
          git add datos.json live_data.json
          git diff --staged --quiet || git commit -m "Actualizacion automatica general y de estados"
          # NUEVO: por si el remoto avanzó entre el checkout y el push (defensivo, además de concurrency)
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
