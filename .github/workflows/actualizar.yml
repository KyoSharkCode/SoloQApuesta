name: Actualizar Tabla de LoL de forma Automatica

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (antes era cada 30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos de ranking
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python actualizar_datos.py

      - name: Actualizar estado en vivo
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python live_status.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name 'RiotBot'
          git config --global user.email 'riotbot@github.com'
          git add datos.json live_data.json
          git diff --staged --quiet || git commit -m "Actualizacion automatica general y de estados"
          git push
