name: Ranking y Estadisticas de LoL

on:
  workflow_dispatch: # Permite ejecución manual
  schedule:
    - cron: '*/10 * * * *' # Ejecuta el workflow automáticamente cada 10 minutos

permissions:
  contents: write

# Evita que dos corridas de ESTE workflow se pisen entre sí
concurrency:
  group: actualizar-datos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para evitar problemas en el rebase

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos de ranking
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python actualizar_datos.py

      - name: Actualizar estado en vivo
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python live_status.py

      - name: Guardar JSON en GitHub
        if: always()
        run: |
          # Usamos el usuario oficial del bot de GitHub Actions
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # Atrapamos todos los JSON modificados o creados (no falla si falta uno)
          git add *.json || true
          
          # Hacemos commit solo si realmente hubo cambios en los JSON
          git diff --staged --quiet || git commit -m "Actualización de datos 🤖 [skip ci]"
          
          # Sincronizamos con el repositorio remoto usando rebase (historial limpio, sin "theirs" destructivo)
          git pull --rebase origin main
          
          # Empujamos a la rama main
          git push origin main
