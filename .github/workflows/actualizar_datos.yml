name: Ranking y Estadisticas de LoL

on:
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos corridas de ESTE workflow se pisen entre sí
concurrency:
  group: actualizar-datos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:

      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos de ranking
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python actualizar_datos.py

      - name: Actualizar estado en vivo
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python live_status.py

      # Solo hace push de los JSON — sin deploy de Pages
      # Los HTML leen los datos desde jsDelivr CDN directamente
      - name: Guardar JSON en GitHub
        id: guardar
        if: always()
        run: |
          git config --global user.name 'RiotBot'
          git config --global user.email 'riotbot@github.com'
          git add datos.json live_data.json
          if git diff --staged --quiet; then
            echo "hubo_cambios=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualizacion de datos [skip ci]"
            # "ours" protege los datos recien generados en este run si hay
            # un conflicto con el remoto (en vez de descartarlos)
            git pull --no-rebase --strategy-option=ours origin main
            git push origin main
            echo "hubo_cambios=true" >> "$GITHUB_OUTPUT"
          fi

      # jsDelivr cachea los archivos servidos vía @main durante horas,
      # así que sin esto la web puede seguir mostrando datos viejos aunque
      # el push ya se haya hecho. Esto fuerza a jsDelivr a refrescar su
      # copia justo después de cada push.
      - name: Purgar caché de jsDelivr
        if: always() && steps.guardar.outputs.hubo_cambios == 'true'
        run: |
          curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/datos.json" || true
          curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/live_data.json" || true
