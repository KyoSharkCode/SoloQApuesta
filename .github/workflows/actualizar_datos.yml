name: Ranking y Estadisticas de LoL

on:
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos corridas de ESTE workflow se pisen entre sí
concurrency:
  group: actualizar-datos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:

      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos de ranking
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python actualizar_datos.py

      - name: Actualizar estado en vivo
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python live_status.py

      - name: Guardar cambios en GitHub
        if: always()
        run: |
          git config --global user.name 'RiotBot'
          git config --global user.email 'riotbot@github.com'
          git add datos.json live_data.json
          git diff --staged --quiet || git commit -m "Actualizacion de ranking y estado en vivo"
          git pull --strategy-option=theirs origin main
          git push origin main
