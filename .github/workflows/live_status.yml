name: Estado en Vivo (En Partida / Offline)

on:
  schedule:
    - cron: '*/30 * * * *'   # respaldo cada 30 min; el disparo real cada 5 min lo hace cron-job.org via workflow_dispatch
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos corridas de ESTE workflow se pisen entre sí
concurrency:
  group: live-status
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:

      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar estado en vivo
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python live_status.py

      - name: Guardar cambios en GitHub
        if: always()
        run: |
          git config --global user.name 'RiotBot'
          git config --global user.email 'riotbot@github.com'
          git add live_data.json
          git diff --staged --quiet || git commit -m "Actualizacion de estado en vivo"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
