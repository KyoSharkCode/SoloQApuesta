<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle de Partida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="shortcut icon" href="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/764bbd9c-6d80-481d-8136-96848f01e843/ddx6q22-c6936a5b-73d6-409d-b248-0b370494f90f.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi83NjRiYmQ5Yy02ZDgwLTQ4MWQtODEzNi05Njg0OGYwMWU4NDMvZGR4NnEyMi1jNjkzNmE1Yi03M2Q2LTQwOWQtYjI0OC0wYjM3MDQ5NGY5MGYucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.5gC4gH1VsNiJXARJGlpuWTYklhg8sRjJiXKO7IpdYeQ" type="image/x-icon" alt="logo">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --panel:#131317; --panel-2:#18181d;
    --border:#232329; --text:#ffffff; --text-dim:#9a9aa3;
    --text-faint:#a1a1aa; --accent:#8b5cf6; --accent-soft:#a78bfa;
    --win:#34d399; --win-bg:rgba(52,211,153,.12);
    --loss:#f87171; --loss-bg:rgba(248,113,113,.12);
    --gold:#fbbf24; --blue:#60a5fa; --red:#f87171;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: radial-gradient(800px 400px at 50% 0%, rgba(139,92,246,.15), transparent), var(--bg);
    color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
  }
  .wrap{ max-width:980px; margin:0 auto; padding:40px 20px 100px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
  .back-btn{ display:inline-flex; align-items:center; color:var(--accent-soft); text-decoration:none; font-weight:600; font-size:14px; transition:color 0.2s; }
  .back-btn:hover{ color:#ffffff; }
  .share-btn{
    display:none; align-items:center; gap:8px; background:var(--panel-2);
    border:1px solid var(--border); color:var(--text); padding:9px 16px;
    border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
    transition:border-color .2s ease, opacity .2s ease; font-family:inherit;
  }
  .share-btn:hover{ border-color:var(--accent-soft); }
  .share-btn:disabled{ opacity:.6; cursor:default; }

  /* Menú "Compartir" — antes usábamos navigator.share() y dejábamos que el
     sistema operativo decidiera qué hacer con "Copiar", pero eso se
     comportaba distinto (y mal) en cada plataforma: en Windows el Ctrl+V
     no pegaba nada, en Mac se pegaba la imagen dos veces. Ahora controlamos
     nosotros mismos las dos acciones con la Clipboard API y la descarga
     normal, así el comportamiento es el mismo en todos lados. */
  .share-wrap{ position:relative; }
  .share-menu{
    position:absolute; top:calc(100% + 8px); right:0; z-index:30;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:6px; display:flex; flex-direction:column; gap:2px; min-width:230px;
    box-shadow:0 14px 34px rgba(0,0,0,.5);
  }
  .share-menu[hidden]{ display:none; }
  .share-menu-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:transparent; border:none; color:var(--text); padding:10px 12px;
    border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;
    font-family:inherit; transition:background .15s ease;
  }
  .share-menu-item:hover:not(:disabled){ background:var(--panel-2); }
  .share-menu-item:disabled{ opacity:.4; cursor:default; }
  .share-menu-item.success{ color:var(--win); }
  .share-menu-item.error{ color:var(--loss); }
  .share-menu-hint{ padding:6px 12px 4px; font-size:11px; color:var(--text-dim); }

  #state-msg{ text-align:center; padding:70px 20px; color:var(--text-dim); font-weight:600; }
  #state-msg.error{ color:var(--loss); }
  .retry-btn{ margin-top:16px; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 18px; border-radius:10px; font-weight:700; cursor:pointer; font-size:13px; }
  .retry-btn:hover{ border-color:var(--accent-soft); }

  /* CABECERA DE PARTIDA */
  .match-header{
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    padding:22px 26px; margin-bottom:28px; border-radius:18px;
    border:1px solid var(--border); background:var(--panel);
    border-left:5px solid var(--text-dim);
  }
  .match-header.victoria{ border-left-color:var(--win); }
  .match-header.derrota{ border-left-color:var(--loss); }
  .match-header.remake{ border-left-color:var(--text-dim); }
  .mh-result{ font-size:22px; font-weight:900; letter-spacing:.02em; }
  .mh-result.victoria{ color:var(--win); }
  .mh-result.derrota{ color:var(--loss); }
  .mh-result.remake{ color:var(--text-dim); }
  .mh-champ{ display:flex; align-items:center; gap:12px; }
  .mh-champ img{ width:56px; height:56px; border-radius:14px; border:2px solid var(--accent-soft); background:#1d1d24; object-fit:cover; }
  .mh-champ-info{ display:flex; flex-direction:column; gap:2px; }
  .mh-champ-name{ font-weight:800; font-size:16px; }
  .mh-spells{ display:flex; gap:6px; }
  .mh-spells img{ width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:#1d1d24; }
  .mh-meta{ margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:4px; color:var(--text-faint); font-size:12.5px; font-weight:600; }
  .mh-kda-big{ font-size:20px; font-weight:900; color:#fff; }

  /* BADGES DE DESEMPEÑO */
  .perf-badges{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px; }
  .perf-badge{ display:flex; align-items:center; gap:8px; padding:7px 14px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid; }
  .perf-badge.good{ color:var(--win); border-color:rgba(52,211,153,.5); background:var(--win-bg); }
  .perf-badge.bad{ color:var(--loss); border-color:rgba(248,113,113,.5); background:var(--loss-bg); }

  /* STATS PERSONALES */
  .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; margin-bottom:28px; }
  .stat-tile{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .stat-tile .st-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:700; margin-bottom:6px; }
  .stat-tile .st-value{ font-size:19px; font-weight:800; color:#fff; }

  /* BUILD DE ITEMS */
  .build-section{ margin-bottom:28px; }
  .build-section h3{ font-size:14px; text-transform:uppercase; color:var(--text-faint); font-weight:700; margin:0 0 12px; }
  .items-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .items-row img{ width:42px; height:42px; border-radius:8px; border:1px solid var(--border); background:#1d1d24; object-fit:cover; }
  .item-empty{ width:42px; height:42px; border-radius:8px; border:1px dashed var(--border); background:#141418; }

  /* MARCADOR COMPLETO */
  .scoreboard{ margin-bottom:20px; }
  .team-block{ margin-bottom:22px; border-radius:14px; overflow:hidden; border:1px solid var(--border); }
  .team-head{ display:flex; align-items:center; justify-content:space-between; padding:11px 16px; font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.05em; }
  .team-head.blue{ background:rgba(96,165,250,.12); color:var(--blue); border-bottom:1px solid rgba(96,165,250,.25); }
  .team-head.red{ background:rgba(248,113,113,.12); color:var(--red); border-bottom:1px solid rgba(248,113,113,.25); }
  .team-objectives{ display:flex; gap:14px; font-size:11.5px; font-weight:600; color:var(--text-faint); }
  .team-objectives span{ white-space:nowrap; }
  .team-rows{ background:var(--panel); }
  /* FIX: columnas con ancho FIJO (no "auto") — cada .p-row es su propio
     grid independiente, así que con "auto" cada fila calculaba el ancho
     de sus columnas según SU PROPIO contenido (KDA/CS con más o menos
     dígitos) y el bloque de items terminaba empezando en una posición X
     distinta en cada fila → efecto "escalera". Con anchos fijos todas
     las filas alinean sus columnas exactamente igual. */
  /* FIX: la primera columna (64px) estaba pensada solo para campeón+hechizos
     (36+10+16=62px, justo). Al agregar las runas (otro ícono de 16px + gap)
     el bloque .p-champ pasó a medir ~88px y se salía de esos 64px, empujando
     y amontonando todo lo de al lado — por eso se ensancha a 96px. */
  .p-row{ display:grid; grid-template-columns:96px 1fr 92px 128px 176px; align-items:center; gap:14px; padding:10px 16px; border-top:1px solid var(--border); font-size:13px; }
  .p-row:first-child{ border-top:none; }
  .p-row.self{ background:rgba(139,92,246,.08); }
  .p-champ{ display:flex; align-items:center; gap:10px; min-width:0; }
  .p-champ img.p-champ-img{ width:36px; height:36px; border-radius:8px; background:#1d1d24; object-fit:cover; flex-shrink:0; }
  .p-spells{ display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .p-spells img{ width:16px; height:16px; border-radius:4px; border:1px solid var(--border); background:#1d1d24; }
  /* RUNAS — keystone arriba (círculo, fondo oscuro típico de Riot) + árbol
     secundario abajo, mismo tamaño que los hechizos para que la fila no
     se desarme. */
  .p-runes{ display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .p-runes img{ width:16px; height:16px; border-radius:50%; border:1px solid var(--border); background:#0a0a0c; object-fit:contain; padding:1px; }
  .p-name-block{ min-width:0; display:flex; flex-direction:column; line-height:1.3; }
  .p-name{ font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
  .p-name.group-name{ color:var(--accent-soft); }
  .p-role-row{ display:flex; align-items:center; gap:4px; }
  .p-role-icon{ width:13px; height:13px; object-fit:contain; opacity:.85; flex-shrink:0; }
  .p-role-emoji{ display:none; font-size:11px; flex-shrink:0; }
  .p-champ-name{ font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p-kda{ font-weight:700; white-space:nowrap; }
  .p-kda-sub{ font-size:11px; color:var(--text-faint); }
  .p-cs{ color:var(--text-faint); font-size:12px; white-space:nowrap; }
  .p-items{ display:flex; gap:3px; }
  .p-items img{ width:22px; height:22px; border-radius:5px; border:1px solid var(--border); background:#1d1d24; }
  .p-items .item-empty{ width:22px; height:22px; border-radius:5px; border:1px dashed var(--border); background:#141418; }

  #partida-content{ display:none; }

  @media (max-width:640px){
    .wrap{ padding:24px 14px 80px; }
    .match-header{ padding:18px; }
    .mh-meta{ margin-left:0; align-items:flex-start; width:100%; }
    .p-row{ grid-template-columns:1fr auto; grid-template-areas:"champ kda" "items items"; row-gap:6px; padding:12px 16px; }
    .p-champ{ grid-area:champ; }
    .p-kda{ grid-area:kda; text-align:right; }
    .p-cs{ display:none; }
    .p-items{ grid-area:items; }
    .team-objectives{ flex-wrap:wrap; row-gap:4px; }
  }

  .site-footer{ margin-top:60px; padding-top:40px; border-top:1px solid var(--border); text-align:center; display:flex; flex-direction:column; align-items:center; }
  .footer-logo{ width:70px; height:auto; margin-bottom:12px; }
  .site-footer p{ margin:0; font-size:14px; color:var(--text-dim); font-weight:500; }

  /* Menú flotante desplegable */
  .fab-menu{ position:fixed; right:28px; bottom:28px; z-index:999; display:flex; flex-direction:column; align-items:flex-end; gap:14px; }
  .fab-main{
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:26px; font-weight:400; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 24px rgba(139,92,246,.55);
    transition:transform .25s ease, box-shadow .2s ease;
  }
  .fab-main:hover{ box-shadow:0 6px 32px rgba(139,92,246,.75); }
  .fab-menu.open .fab-main{ transform:rotate(45deg); }
  .fab-options{ display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
  .fab-option{
    display:flex; align-items:center; gap:10px; text-decoration:none;
    opacity:0; transform:translateY(10px) scale(.85); pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .fab-menu.open .fab-option{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .fab-menu.open .fab-option:nth-child(1){ transition-delay:.09s; }
  .fab-menu.open .fab-option:nth-child(2){ transition-delay:.06s; }
  .fab-menu.open .fab-option:nth-child(3){ transition-delay:.03s; }
  .fab-option-icon{
    width:46px; height:46px; border-radius:50%; background:var(--panel-2);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:0 4px 16px rgba(0,0,0,.45); flex-shrink:0;
  }
  .fab-option-label{
    font-size:12px; font-weight:700; color:var(--text); background:var(--panel-2);
    padding:5px 10px; border-radius:8px; border:1px solid var(--border);
    white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="back-btn" id="back-link">← Volver</a>
    <div class="share-wrap" id="share-wrap">

      <div class="share-menu" id="share-menu" hidden>

    <div class="perf-badges" id="perf-badges"></div>

    <div class="stats-grid" id="stats-grid"></div>

    <div class="build-section" id="build-section" style="display:none;">

    </div>

    <div class="scoreboard" id="scoreboard"></div>
  </div>

  <footer class="site-footer">
    <img src="SoloQRetoLogo.svg" alt="Logo SoloQ Reto" class="footer-logo">
    <p>creado por KyoSumiVT</p>

</div>

<div class="fab-menu" id="fabMenu">
  <div class="fab-options">
    <a class="fab-option" href="campeones.html">
      <span class="fab-option-label">Campeones</span>
      <span class="fab-option-icon">🏆</span>
    </a>
    <a class="fab-option" href="versus.html">
      <span class="fab-option-label">Versus</span>
      <span class="fab-option-icon">⚔️</span>
    </a>
    <a class="fab-option" href="index.html">
      <span class="fab-option-label">Inicio</span>
      <span class="fab-option-icon">🏠</span>
    </a>
  </div>
  <button class="fab-main" id="fabMainBtn" type="button" aria-label="Menú de navegación" title="Menú">+</button>
</div>
<script>
(function(){
  var menu = document.getElementById('fabMenu');
  var btn  = document.getElementById('fabMainBtn');
  if(!menu || !btn) return;
  btn.addEventListener('click', function(e){ e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('click', function(e){ if(menu.classList.contains('open') && !menu.contains(e.target)) menu.classList.remove('open'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') menu.classList.remove('open'); });
})();
</script>

<script>
window.addEventListener('load', () => {
  const params    = new URLSearchParams(window.location.search);
  const matchId   = params.get('match_id');
  const jugadorId = params.get('jugador'); // "Nombre#Tag" completo, opcional

  const CDN     = 'https://raw.githubusercontent.com/KyoSharkCode/SoloQApuesta/main';
  const DDRAGON = 'https://ddragon.leagueoflegends.com/cdn/16.16.1';
  // FIX: a diferencia de campeón/item/hechizo (que sí viven bajo la carpeta
  // versionada /cdn/<version>/img/...), los íconos de runas NO están
  // versionados en DDragon — viven en /cdn/img/... a secas (el mismo patrón
  // que ya usa el splash art: /cdn/img/champion/loading/...). Pedirlos con
  // el número de versión delante daba 403 y por eso nunca cargaban, aunque
  // el catálogo (que sí es versionado) se descargaba bien.
  const DDRAGON_IMG_BASE = 'https://ddragon.leagueoflegends.com/cdn/img';

  const backLink = document.getElementById('back-link');
  if (jugadorId) {
    backLink.href = `perfil.html?jugador=${encodeURIComponent(jugadorId)}`;
    backLink.textContent = '← Volver al Perfil';
  }

  // Runas — a diferencia de campeones/items/hechizos, Riot NO expone un
  // patrón de URL predecible por id de runa (p.ej. "8005.png" no existe).
  // Hay que descargar el catálogo runesReforged.json una vez (json chico,
  // ~15kb, cacheable) y armar un mapa id→ruta de ícono. El dato del id de
  // la runa en sí (perk_principal / estilo_secundario) ya viene guardado
  // en datos_partidas.json desde antes — no hace falta tocar el bot.
  let runasMap = {};
  async function cargarCatalogoRunas(){
    try {
      const res = await fetch(`${DDRAGON}/data/en_US/runesReforged.json`);
      if (!res.ok) return;
      const data = await res.json();
      (data || []).forEach(estilo => {
        runasMap[estilo.id] = estilo.icon;
        (estilo.slots || []).forEach(slot => {
          (slot.runes || []).forEach(r => { runasMap[r.id] = r.icon; });
        });
      });
    } catch (e) {
      console.error('no se pudo cargar el catálogo de runas', e);
    }
  }
  const runeUrl = (perkId) => (perkId && runasMap[perkId]) ? `${DDRAGON_IMG_BASE}/${runasMap[perkId]}` : null;

  // FIX: DDragon es sensible a mayúsculas/minúsculas en el nombre de archivo,
  // y en un puñado de campeones el "championName" que guarda la API de Riot
  // no coincide exactamente con el nombre real del archivo en DDragon. El
  // caso clásico es FiddleSticks: Riot lo guarda como "FiddleSticks" (S
  // mayúscula) pero el ícono real es "Fiddlesticks.png" (s minúscula) — por
  // eso su imagen nunca cargaba aunque el resto del equipo sí.
  const CHAMPION_ID_OVERRIDES = { FiddleSticks: 'Fiddlesticks' };
  const fmt = (name) => {
    const clean = (name || '').replace(/[^a-zA-Z0-9]/g, '');
    return CHAMPION_ID_OVERRIDES[clean] || clean;
  };
  const champUrl  = (name) => `${DDRAGON}/img/champion/${fmt(name)}.png`;
  const spellUrl  = (name) => `${DDRAGON}/img/spell/${name}.png`;
  const itemUrl   = (id)   => `${DDRAGON}/img/item/${id}.png`;
  // "Loading screen" del campeón (no el splash art panorámico) — Riot ya
  // la recorta a formato vertical (308x560, la misma que usa el cliente
  // de LoL en la pantalla de carga), centrando al personaje bastante mejor
  // que si recortáramos nosotros el splash panorámico a mano. El splash
  // (1215x717) tiene al personaje en cualquier posición dentro del cuadro
  // — a veces a la derecha, como Caitlyn — y como nuestro panel es angosto
  // y alto, terminaba recortándolo por completo. Con esta versión vertical
  // casi nunca hace falta recortar a los lados, solo un poco arriba/abajo.
  const splashUrl = (name) => `https://ddragon.leagueoflegends.com/cdn/img/champion/loading/${fmt(name)}_0.jpg`;

  // Roles — mismo mapeo que ya usa el resto del sitio (BOTTOM→ADC,
  // UTILITY→SUPPORT). Los iconos son los mismos minimalistas que Riot usa
  // para elegir posición en el cliente (CommunityDragon); si por lo que
  // sea no cargan, cae automáticamente al emoji.
  const ROLE_ICON_BASE = 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-clash/global/default/assets/images/position-selector/positions/icon-position-';
  const ROLES = {
    TOP:     { orden: 0, label: 'TOP',     emoji: '⚔️', slug: 'top' },
    JUNGLE:  { orden: 1, label: 'JUNGLE',  emoji: '🌲', slug: 'jungle' },
    MIDDLE:  { orden: 2, label: 'MID',     emoji: '🔮', slug: 'middle' },
    BOTTOM:  { orden: 3, label: 'ADC',     emoji: '🏹', slug: 'bottom' },
    UTILITY: { orden: 4, label: 'SUPPORT', emoji: '🛡️', slug: 'utility' },
  };
  const rolInfo  = (rol) => ROLES[rol] || { orden: 99, label: rol || '—', emoji: '❔', slug: null };
  const rolOrden = (rol) => rolInfo(rol).orden;
  const rolHtml  = (rol) => {
    const info = rolInfo(rol);
    const iconHtml = info.slug
      ? `<img class="p-role-icon" src="${ROLE_ICON_BASE}${info.slug}.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
         <span class="p-role-emoji">${info.emoji}</span>`
      : `<span class="p-role-emoji" style="display:inline;">${info.emoji}</span>`;
    return `<span class="p-role-row">${iconHtml}<span>${info.label}</span></span>`;
  };

  // Objetivos de equipo (dragones, barón, larvas del vacío, torres,
  // inhibidores) — a diferencia de los iconos de rol, CommunityDragon no
  // distribuye estos como imágenes sueltas (Riot los empaqueta dentro de
  // un atlas del HUD, no como archivos individuales), así que se quedan
  // en emoji — se ven bien y no dependen de adivinar una URL que rompa.
  function objIconHtml(slug, emoji, valor){
    return `<span title="${slug}">${emoji} ${valor||0}</span>`;
  }

  // ── Tarjeta para compartir ──────────────────────────────────────────
  // Genera una imagen (canvas, sin librerías externas) con el resumen de
  // la partida del jugador identificado en la URL, para mandarla directo
  // al chat del grupo sin tener que compartir el link. Si el navegador
  // soporta compartir archivos (celulares, sobre todo) abre el share
  // nativo; si no, descarga el PNG.
  let ultimoRenderParaCompartir = null;

  function cargarImagenSegura(src){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous'; // si el servidor no permite CORS, falla el load en vez de "manchar" el canvas
      img.onload  = () => resolve(img);
      img.onerror = () => reject(new Error('no se pudo cargar: ' + src));
      img.src = src;
    });
  }

  // Dibuja el borde de un rectángulo redondeado (sin fill/stroke — el que
  // llama decide qué hacer con el path después).
  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  // "background-size: cover" pero recortando desde la imagen ORIGEN (mejor
  // calidad que escalar y luego recortar) — usado para el splash art, que
  // es panorámico y hay que encajarlo en un panel más angosto y alto.
  function drawCoverImage(ctx, img, x, y, w, h){
    const imgRatio = img.width / img.height;
    const boxRatio = w / h;
    let sx, sy, sw, sh;
    if (imgRatio > boxRatio) {
      sh = img.height; sw = sh * boxRatio; sx = (img.width - sw) / 2; sy = 0;
    } else {
      sw = img.width; sh = sw / boxRatio; sx = 0; sy = (img.height - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  async function generarTarjetaImagen(){
    const { self, detalle, resultadoTexto, jugadores } = ultimoRenderParaCompartir || {};
    if (!self) throw new Error('sin datos de jugador para compartir');

    const W = 1100, H = 620;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const colorResultado = self.victoria ? '#34d399' : '#f87171';

    // ── Fondo base (degradado del panel derecho) ──
    const gradBg = ctx.createLinearGradient(0, 0, W, H);
    gradBg.addColorStop(0, '#18181d');
    gradBg.addColorStop(1, '#0a0a0c');
    ctx.fillStyle = gradBg;
    ctx.fillRect(0, 0, W, H);

    // ── Panel izquierdo: splash art del campeón, recortado con un corte
    // diagonal (más angosto arriba que abajo, para que se sienta dinámico) ──
    // Corte diagonal más angosto que antes — le da más espacio al panel de
    // información de la derecha y, de paso, la proporción del panel del
    // splash queda mucho más cerca de la proporción vertical de la imagen
    // "loading" (0.55), así que se recorta mucho menos personaje (antes se
    // recortaba ~39% de alto, ahora ~21%).
    const xTop = 360, xBottom = 430, anchoSplash = Math.max(xTop, xBottom);

    let splashImg = null;
    try { splashImg = await cargarImagenSegura(splashUrl(self.campeon)); } catch (e) { splashImg = null; }

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(xTop, 0);
    ctx.lineTo(xBottom, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.clip();

    if (splashImg) {
      drawCoverImage(ctx, splashImg, 0, 0, anchoSplash, H);
    } else {
      ctx.fillStyle = '#1d1d24';
      ctx.fillRect(0, 0, anchoSplash, H);
      ctx.fillStyle = '#a78bfa';
      ctx.font = '900 100px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText((self.campeon || '?').slice(0, 2).toUpperCase(), anchoSplash / 2, H / 2 + 34);
      ctx.textAlign = 'left';
    }
    // Sombreado leve — que se note el corte sin importar qué tan clara sea la ilustración
    const overlayL = ctx.createLinearGradient(0, 0, 0, H);
    overlayL.addColorStop(0,    'rgba(10,10,12,0.05)');
    overlayL.addColorStop(0.7,  'rgba(10,10,12,0.12)');
    overlayL.addColorStop(1,    'rgba(10,10,12,0.6)');
    ctx.fillStyle = overlayL;
    ctx.fillRect(0, 0, anchoSplash, H);
    ctx.restore();

    // Línea de acento sobre la diagonal
    ctx.strokeStyle = '#8b5cf6';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(xTop, 0);
    ctx.lineTo(xBottom, H);
    ctx.stroke();

    // ── Cinta oscura que cruza justo la diagonal — ahí va el nombre ──
    const nameBandY = 34, nameBandH = 94;
    const nameGrad = ctx.createLinearGradient(xTop - 70, 0, xTop + 300, 0);
    nameGrad.addColorStop(0,    'rgba(10,10,12,0)');
    nameGrad.addColorStop(0.35, 'rgba(10,10,12,0.88)');
    nameGrad.addColorStop(1,    'rgba(10,10,12,0.88)');
    ctx.fillStyle = nameGrad;
    ctx.fillRect(xTop - 70, nameBandY, W - (xTop - 70), nameBandH);

    const nameX = xTop + 24;
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 34px Arial, sans-serif';
    ctx.fillText(self.campeon || '—', nameX, nameBandY + 46);
    ctx.fillStyle = '#a78bfa';
    ctx.font = '700 16px Arial, sans-serif';
    ctx.fillText(`${rolInfo(self.rol).label} · ${self.nombre_grupo || ''}`, nameX, nameBandY + 74);

    // ── Resultado, arriba a la derecha ──
    ctx.fillStyle = colorResultado;
    ctx.font = '900 30px Arial, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText((resultadoTexto || '').toUpperCase(), W - 44, 64);
    ctx.textAlign = 'left';

    // A partir de acá, todo el contenido usa esta X — queda siempre a la
    // derecha del corte diagonal sin importar la altura (xBottom es el
    // punto más ancho de la diagonal, así que +30 siempre da margen).
    const contentX = xBottom + 30;

    // ── KDA grande ──
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 42px Arial, sans-serif';
    const kdaTexto = `${self.kills}/${self.muertes}/${self.asistencias}`;
    ctx.fillText(kdaTexto, contentX, 200);
    const kdaAncho = ctx.measureText(kdaTexto).width;
    ctx.fillStyle = '#71717a';
    ctx.font = '700 13px Arial, sans-serif';
    ctx.fillText('KDA', contentX, 220);

    // ── Runas: keystone (principal) + escudo del árbol secundario, estilo
    // OP.GG — se ubican a la derecha del número de KDA, con margen dinámico
    // según su ancho real para que nunca se encimen (KDA con más muertes/
    // asistencias mide más ancho). Se dibujan sobre el mismo canvas oscuro
    // porque los íconos de runas de Riot ya vienen con fondo transparente. ──
    const keystoneUrl = runeUrl(self.perk_principal);
    const secundariaUrl = runeUrl(self.estilo_secundario);
    if (keystoneUrl || secundariaUrl) {
      const [keystoneImg, secundariaImg] = await Promise.all([
        keystoneUrl ? cargarImagenSegura(keystoneUrl).catch(() => null) : Promise.resolve(null),
        secundariaUrl ? cargarImagenSegura(secundariaUrl).catch(() => null) : Promise.resolve(null),
      ]);
      const runeX = contentX + kdaAncho + 26;
      const runeY = 155;
      if (keystoneImg) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(runeX + 20, runeY + 20, 20, 0, Math.PI * 2);
        ctx.fillStyle = '#0a0a0c';
        ctx.fill();
        ctx.clip();
        ctx.drawImage(keystoneImg, runeX, runeY, 40, 40);
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(runeX + 20, runeY + 20, 20, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (secundariaImg) {
        const sx = runeX + 27, sy = runeY + 27, sr = 13;
        ctx.save();
        ctx.beginPath();
        ctx.arc(sx + sr, sy + sr, sr, 0, Math.PI * 2);
        ctx.fillStyle = '#131317';
        ctx.fill();
        ctx.clip();
        ctx.drawImage(secundariaImg, sx, sy, sr * 2, sr * 2);
        ctx.restore();
        ctx.strokeStyle = '#0a0a0c';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(sx + sr, sy + sr, sr, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // ── Cajitas de stats, apiladas verticalmente ──
    const stats = [
      ['CS / MIN', `${self.cs} (${self.cs_por_min}/min)`],
      ['DAÑO A CAMPEONES', (self.danio_a_campeones || 0).toLocaleString('es-ES')],
      ['ORO TOTAL', (self.oro || 0).toLocaleString('es-ES')],
      ['VISIÓN', String(self.vision ?? 0)],
    ];
    const boxW = 200, boxH = 48, boxGap = 10;
    let boxY = 250;
    stats.forEach(([label, value]) => {
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      roundRect(ctx, contentX, boxY, boxW, boxH, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.09)';
      ctx.lineWidth = 1;
      roundRect(ctx, contentX, boxY, boxW, boxH, 8);
      ctx.stroke();

      ctx.fillStyle = '#9a9aa3';
      ctx.font = '700 10px Arial, sans-serif';
      ctx.fillText(label, contentX + 12, boxY + 19);
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 18px Arial, sans-serif';
      ctx.fillText(value, contentX + 12, boxY + 38);

      boxY += boxH + boxGap;
    });

    // ── Badges de desempeño (los mismos de la página), apilados a la
    // derecha de las cajitas de stats — ancho de cada uno según su texto,
    // para que nunca se vea cortado. ──
    let equipo = [];
    if (Array.isArray(jugadores)) equipo = jugadores.filter(j => j.equipo === self.equipo);
    const badges = equipo.length >= 2 ? calcularBadgesEquipo(self, equipo) : [];

    const badgeX = contentX + boxW + 20;
    const badgeMaxW = W - badgeX - 40;
    const badgeAreaTop = 250, badgeAreaBottom = 502 - 8; // 502 = buildLabelY (ver más abajo)
    // Puede haber hasta 6 badges (si alguien barre todas las categorías del
    // equipo) — el tamaño de cada pill se calcula según cuántos hay, para
    // que siempre quepan sin invadir la fila de BUILD de abajo.
    const badgeGap = 8;
    const badgePillH = badges.length
      ? Math.max(28, Math.min(40, Math.floor((badgeAreaBottom - badgeAreaTop - (badges.length - 1) * badgeGap) / badges.length)))
      : 40;
    const badgeFontPx = badgePillH >= 36 ? 12.5 : (badgePillH >= 32 ? 11.5 : 10.5);
    let badgeY = badgeAreaTop;
    ctx.font = `700 ${badgeFontPx}px Arial, sans-serif`;
    badges.forEach(b => {
      const texto = `${b.icono} ${b.label}`;
      const pillW = Math.min(ctx.measureText(texto).width + 34, badgeMaxW);
      const colorBadge = b.tipo === 'good' ? '#34d399' : '#f87171';
      const bgBadge    = b.tipo === 'good' ? 'rgba(52,211,153,0.12)' : 'rgba(248,113,113,0.12)';

      ctx.fillStyle = bgBadge;
      roundRect(ctx, badgeX, badgeY, pillW, badgePillH, badgePillH / 2);
      ctx.fill();
      ctx.strokeStyle = colorBadge;
      ctx.lineWidth = 1.3;
      roundRect(ctx, badgeX, badgeY, pillW, badgePillH, badgePillH / 2);
      ctx.stroke();

      ctx.fillStyle = colorBadge;
      ctx.font = `700 ${badgeFontPx}px Arial, sans-serif`;
      ctx.textBaseline = 'middle';
      ctx.fillText(texto, badgeX + 17, badgeY + badgePillH / 2);
      ctx.textBaseline = 'alphabetic';

      badgeY += badgePillH + badgeGap;
    });

    // ── Build de items, franja inferior a lo ancho del degradado ──
    const buildLabelY = 502, buildY = 516, itemSize = 56, itemGap = 10;
    ctx.fillStyle = '#71717a';
    ctx.font = '700 12px Arial, sans-serif';
    ctx.fillText('BUILD', contentX, buildLabelY);

    const itemIds = (self.items || []).filter(id => id > 0);
    const itemImgs = await Promise.all(itemIds.map(id => cargarImagenSegura(itemUrl(id)).catch(() => null)));
    let itemX = contentX;
    itemImgs.forEach(img => {
      if (img) {
        ctx.save();
        roundRect(ctx, itemX, buildY, itemSize, itemSize, 10);
        ctx.clip();
        ctx.drawImage(img, itemX, buildY, itemSize, itemSize);
        ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        roundRect(ctx, itemX, buildY, itemSize, itemSize, 10);
        ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1;
      roundRect(ctx, itemX, buildY, itemSize, itemSize, 10);
      ctx.stroke();
      itemX += itemSize + itemGap;
    });

    // ── Pie: duración/fecha + marca del sitio ──
    const durMin = Math.floor((detalle.duracion_seg || 0) / 60);
    const durSeg = (detalle.duracion_seg || 0) % 60;
    const fechaTxt = detalle.fecha ? new Date(detalle.fecha).toLocaleDateString('es-ES') : '';
    ctx.fillStyle = '#71717a';
    ctx.font = '600 13px Arial, sans-serif';
    ctx.fillText(`${detalle.modo_juego || 'Ranked Solo/Duo'} · ${durMin}:${String(durSeg).padStart(2, '0')} · ${fechaTxt}`, contentX, H - 24);

    ctx.fillStyle = '#8b5cf6';
    ctx.font = '900 20px Arial, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('SoloQReto', W - 44, H - 24);
    ctx.textAlign = 'left';

    return canvas;
  }

  // Blob de la última tarjeta generada — se genera una vez al abrir el
  // menú y se reutiliza tanto para "Copiar" como para "Descargar", para no
  // tener que volver a dibujar el canvas por cada acción.
  let tarjetaBlobCache = null;

  function cerrarMenuFuera(e){
    const wrap = document.getElementById('share-wrap');
    if (!wrap.contains(e.target)) cerrarMenuCompartir();
  }

  function cerrarMenuCompartir(){
    document.getElementById('share-menu').hidden = true;
    document.removeEventListener('click', cerrarMenuFuera, { capture: true });
    document.removeEventListener('keydown', cerrarMenuConEscape);
  }

  function cerrarMenuConEscape(e){
    if (e.key === 'Escape') cerrarMenuCompartir();
  }

  async function abrirMenuCompartir(){
    const btn  = document.getElementById('btn-compartir');
    const menu = document.getElementById('share-menu');
    if (btn.disabled) return;

    // Si ya está abierto, un segundo clic lo cierra.
    if (!menu.hidden) { cerrarMenuCompartir(); return; }

    const textoOriginal = btn.innerHTML;
    btn.innerHTML = '⏳ Generando...';
    btn.disabled = true;
    try {
      const canvas = await generarTarjetaImagen();
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('no se pudo generar la imagen');
      tarjetaBlobCache = blob;

      const btnCopiar = document.getElementById('btn-copiar');
      const soportaCopiar = !!(navigator.clipboard && window.ClipboardItem);
      btnCopiar.disabled = !soportaCopiar;
      btnCopiar.innerHTML = soportaCopiar
        ? '📋 Copiar al portapapeles'
        : '📋 Copiar (no disponible en este navegador)';

      btn.innerHTML = textoOriginal;
      btn.disabled = false;
      menu.hidden = false;
      // El listener se agrega en la siguiente vuelta del loop de eventos
      // para que el clic que abrió el menú no lo cierre de inmediato.
      setTimeout(() => {
        document.addEventListener('click', cerrarMenuFuera, { capture: true });
        document.addEventListener('keydown', cerrarMenuConEscape);
      }, 0);
    } catch (e) {
      console.error(e);
      btn.innerHTML = '⚠️ No se pudo generar';
      setTimeout(() => { btn.innerHTML = textoOriginal; btn.disabled = false; }, 2500);
    }
  }

  async function copiarAlPortapapeles(){
    const item = document.getElementById('btn-copiar');
    if (item.disabled || !tarjetaBlobCache) return;
    const textoOriginal = item.innerHTML;
    try {
      await navigator.clipboard.write([
        new ClipboardItem({ 'image/png': tarjetaBlobCache }),
      ]);
      item.innerHTML = '✅ ¡Copiada!';
      item.classList.add('success');
      setTimeout(cerrarMenuCompartir, 900);
    } catch (e) {
      console.error(e);
      item.innerHTML = '⚠️ No se pudo copiar';
      item.classList.add('error');
      setTimeout(() => {
        item.innerHTML = textoOriginal;
        item.classList.remove('error');
      }, 2200);
    }
  }

  function descargarTarjeta(){
    const item = document.getElementById('btn-descargar');
    if (!tarjetaBlobCache) return;
    const { self } = ultimoRenderParaCompartir || {};
    const nombreArchivo = `soloqreto-${(self && self.campeon || 'partida').toLowerCase()}.png`;
    const url = URL.createObjectURL(tarjetaBlobCache);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    item.innerHTML = '✅ ¡Descargada!';
    setTimeout(cerrarMenuCompartir, 900);
  }

  document.getElementById('btn-compartir').addEventListener('click', abrirMenuCompartir);
  document.getElementById('btn-copiar').addEventListener('click', copiarAlPortapapeles);
  document.getElementById('btn-descargar').addEventListener('click', descargarTarjeta);

  if (!matchId) {
    showState('No se especificó ninguna partida.', true);
    return;
  }

  cargar();

  function showState(msg, isError, showRetry){
    const el = document.getElementById('state-msg');
    el.style.display = 'block';
    el.className = isError ? 'error' : '';
    el.innerHTML = msg + (showRetry ? '<div><button class="retry-btn" id="retry-btn">Reintentar</button></div>' : '');
    document.getElementById('partida-content').style.display = 'none';
    if (showRetry) {
      document.getElementById('retry-btn').addEventListener('click', cargar);
    }
  }

  async function cargar(){
    showState('Cargando partida…', false);
    try {
      // El catálogo de runas se pide en paralelo — si tarda o falla, la
      // partida se muestra igual (runeUrl() simplemente devuelve null y
      // esos íconos no se pintan, ver filaJugador/generarTarjetaImagen).
      const [res] = await Promise.all([
        fetch(`${CDN}/datos_partidas.json?t=${Date.now()}`, { cache: 'no-store' }),
        cargarCatalogoRunas(),
      ]);
      // FIX: un 404 (el archivo todavía no existe en el repo, p.ej. recién
      // agregada la función o el bot no ha vuelto a correr) NO es un error
      // de conexión — es el mismo caso de "esta partida no tiene detalle
      // guardado todavía". Antes caía al mensaje genérico y alarmante de
      // "revisa tu conexión" en vez del mensaje amigable de abajo.
      let todas = {};
      if (res.ok) {
        todas = await res.json();
      } else if (res.status !== 404) {
        throw new Error('fetch-fail: ' + res.status);
      }
      const detalle = todas[matchId];
      if (!detalle) {
        showState(
          'Todavía no hay detalle guardado para esta partida.<br>' +
          'Puede que sea muy reciente (el bot tarda unos minutos), que ya haya salido de las últimas 10 partidas de todos, o que el bot todavía no haya generado datos_partidas.json.',
          false, true
        );
        return;
      }
      render(detalle);
      document.getElementById('state-msg').style.display = 'none';
      document.getElementById('partida-content').style.display = 'block';
    } catch (e) {
      console.error(e);
      showState('No se pudo cargar la partida. Revisa tu conexión.', true, true);
    }
  }

  function render(detalle){
    const jugadores = detalle.jugadores || [];
    const self = jugadorId
      ? jugadores.find(j => j.nombre_grupo && j.nombre_grupo === jugadorId.split('#')[0])
      : null;

    // ── Cabecera ──
    const esRemake = detalle.modo_juego === 'Remake';
    const resultadoTexto = esRemake ? 'Remake' : (self ? (self.victoria ? 'Victoria' : 'Derrota') : (detalle.equipos?.blue?.victoria ? 'Victoria del Equipo Azul' : 'Victoria del Equipo Rojo'));
    const resultadoClase = esRemake ? 'remake' : (self ? (self.victoria ? 'victoria' : 'derrota') : (detalle.equipos?.blue?.victoria ? 'victoria' : 'derrota'));

    // Guardado para el botón "Compartir" — solo tiene sentido con un
    // jugador identificado (self) y una partida real (no Remake).
    ultimoRenderParaCompartir = { self, detalle, resultadoTexto, jugadores };
    const btnCompartir = document.getElementById('btn-compartir');
    btnCompartir.style.display = (self && !esRemake) ? 'inline-flex' : 'none';

    const mhBox = document.getElementById('mh-box');
    mhBox.className = `match-header ${resultadoClase}`;
    document.getElementById('mh-result').className = `mh-result ${resultadoClase}`;
    document.getElementById('mh-result').textContent = resultadoTexto;

    const protagonista = self || jugadores[0] || null;
    if (protagonista) {
      document.getElementById('mh-champ-img').src = champUrl(protagonista.campeon);
      document.getElementById('mh-champ-img').onerror = function(){ this.style.visibility = 'hidden'; };
      document.getElementById('mh-champ-name').textContent = protagonista.campeon || '—';
      document.getElementById('mh-spells').innerHTML = (protagonista.hechizos || []).map(s => `
        <img src="${spellUrl(s)}" alt="${s}" onerror="this.style.visibility='hidden'">`).join('');
      document.getElementById('mh-kda-big').textContent =
        `${protagonista.kills}/${protagonista.muertes}/${protagonista.asistencias}`;
    }

    const durMin = Math.floor((detalle.duracion_seg || 0) / 60);
    const durSeg = (detalle.duracion_seg || 0) % 60;
    const fechaTxt = detalle.fecha ? new Date(detalle.fecha).toLocaleString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
    document.getElementById('mh-submeta').textContent =
      `${detalle.modo_juego || 'Ranked Solo/Duo'} · ${durMin}:${String(durSeg).padStart(2,'0')} · ${fechaTxt}`;

    // ── Badges de desempeño (contra el propio equipo) ──
    const badgesEl = document.getElementById('perf-badges');
    if (self && !esRemake) {
      const equipo = jugadores.filter(j => j.equipo === self.equipo);
      badgesEl.innerHTML = calcularBadgesEquipo(self, equipo).map(b => `
        <div class="perf-badge ${b.tipo}"><span>${b.icono}</span><span>${b.label}</span></div>`).join('');
    } else {
      badgesEl.innerHTML = '';
    }

    // ── Stats personales ──
    const statsEl = document.getElementById('stats-grid');
    if (self && !esRemake) {
      const tiles = [
        { label:'KDA', value:`${self.kills}/${self.muertes}/${self.asistencias}` },
        { label:'CS', value:`${self.cs} (${self.cs_por_min}/min)` },
        { label:'Daño a campeones', value:(self.danio_a_campeones||0).toLocaleString('es-ES') },
        { label:'Daño recibido', value:(self.danio_recibido||0).toLocaleString('es-ES') },
        { label:'Oro', value:(self.oro||0).toLocaleString('es-ES') },
        { label:'Visión', value:self.vision },
        { label:'Wards puestos', value:self.wards_colocadas },
        { label:'Wards destruidos', value:self.wards_destruidas },
      ];
      statsEl.innerHTML = tiles.map(t => `
        <div class="stat-tile"><div class="st-label">${t.label}</div><div class="st-value">${t.value}</div></div>`).join('');
    } else {
      statsEl.innerHTML = '';
    }

    // ── Build de items ──
    const buildSection = document.getElementById('build-section');
    if (self && !esRemake) {
      buildSection.style.display = 'block';
      document.getElementById('items-row').innerHTML = (self.items || []).map(id =>
        id > 0
          ? `<img src="${itemUrl(id)}" alt="item ${id}" onerror="this.style.visibility='hidden'">`
          : `<div class="item-empty"></div>`
      ).join('');
    } else {
      buildSection.style.display = 'none';
    }

    // ── Marcador completo ──
    const scoreboardEl = document.getElementById('scoreboard');
    if (esRemake) {
      scoreboardEl.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:20px;">Esta partida fue un Remake — sin estadísticas.</p>';
    } else {
      const equiposOrden = ['blue', 'red'];
      scoreboardEl.innerHTML = equiposOrden.map(lado => {
        // Orden fijo por rol: Top, Jungla, Mid, ADC, Support — como pidió Alex.
        const jugs = jugadores.filter(j => j.equipo === lado).sort((a,b) => rolOrden(a.rol) - rolOrden(b.rol));
        const eqInfo = (detalle.equipos && detalle.equipos[lado]) || {};
        const nombreLado = lado === 'blue' ? 'Equipo Azul' : 'Equipo Rojo';
        const resultadoLado = eqInfo.victoria ? 'Victoria' : 'Derrota';
        return `
          <div class="team-block">
            <div class="team-head ${lado}">
              <span>${nombreLado} · ${resultadoLado}</span>
              <span class="team-objectives">
                ${objIconHtml('dragon', '🐉', eqInfo.dragones)}
                ${objIconHtml('herald', '🦏', eqInfo.heraldos)}
                ${objIconHtml('baron', '👹', eqInfo.barones)}
                ${objIconHtml('grubs', '🐛', eqInfo.vacuolarvas)}
                ${objIconHtml('tower', '🗼', eqInfo.torres)}
                ${objIconHtml('inhibitor', '🏰', eqInfo.inhibidores)}
              </span>
            </div>
            <div class="team-rows">
              ${jugs.map(j => filaJugador(j, self)).join('')}
            </div>
          </div>`;
      }).join('');
    }
  }

  function filaJugador(j, self){
    const esSelf = self && j.nombre_grupo === self.nombre_grupo;
    const nombreMostrar = j.nombre_grupo || j.riot_id;
    const nombreClase = j.nombre_grupo ? 'p-name group-name' : 'p-name';
    const itemsHtml = (j.items || []).map(id =>
      id > 0
        ? `<img src="${itemUrl(id)}" alt="" onerror="this.style.visibility='hidden'">`
        : `<div class="item-empty"></div>`
    ).join('');
    // Keystone (perk_principal) + árbol secundario (estilo_secundario) —
    // ya vienen guardados en datos_partidas.json, solo falta resolver el
    // id a un ícono vía el catálogo cargado en cargarCatalogoRunas().
    const keystoneUrl = runeUrl(j.perk_principal);
    const secundariaUrl = runeUrl(j.estilo_secundario);
    const runesHtml = (keystoneUrl || secundariaUrl) ? `
      <div class="p-runes">
        ${keystoneUrl ? `<img src="${keystoneUrl}" alt="runa principal" onerror="this.style.visibility='hidden'">` : ''}
        ${secundariaUrl ? `<img src="${secundariaUrl}" alt="árbol secundario" onerror="this.style.visibility='hidden'">` : ''}
      </div>` : '';
    return `
      <div class="p-row ${esSelf ? 'self' : ''}">
        <div class="p-champ">
          <img class="p-champ-img" src="${champUrl(j.campeon)}" alt="${j.campeon}" onerror="this.style.visibility='hidden'">
          <div class="p-spells">
            ${(j.hechizos||[]).map(s => `<img src="${spellUrl(s)}" alt="" onerror="this.style.visibility='hidden'">`).join('')}
          </div>
          ${runesHtml}
        </div>
        <div class="p-name-block">
          <span class="${nombreClase}">${nombreMostrar}</span>
          <span class="p-champ-name">${j.campeon || ''} · ${rolHtml(j.rol)}</span>
        </div>
        <div>
          <div class="p-kda">${j.kills}/${j.muertes}/${j.asistencias}</div>
          <div class="p-kda-sub">${(j.danio_a_campeones||0).toLocaleString('es-ES')} daño</div>
        </div>
        <div class="p-cs">${j.cs} CS (${j.cs_por_min}/min)</div>
        <div class="p-items">${itemsHtml}</div>
      </div>`;
  }

  // Compara al jugador contra su propio equipo (5 jugadores de esa partida)
  // — el mismo criterio que se confirmó para los badges de desempeño.
  function calcularBadgesEquipo(self, equipo){
    if (equipo.length < 2) return [];
    const badges = [];

    function evaluar(campo, extractor, iconoGood, labelGood, iconoBad, labelBad){
      const valores = equipo.map(extractor);
      const max = Math.max(...valores);
      const min = Math.min(...valores);
      if (max === min) return; // todos iguales, no hay nada que destacar
      const propio = extractor(self);
      if (propio === max) badges.push({ tipo:'good', icono:iconoGood, label:labelGood });
      else if (propio === min) badges.push({ tipo:'bad', icono:iconoBad, label:labelBad });
    }

    evaluar('danio', j => j.danio_a_campeones||0, '🗡️', 'Mejor daño del equipo', '🪶', 'Menos daño del equipo');

    // El farmeo NO se compara igual para el support — estructuralmente
    // hace mucho menos CS que el resto (se dedica a proteger al ADC, no
    // a golear minions). Se compara solo entre los 4 no-support, y al
    // support directamente no se le evalúa este badge (ni bueno ni malo).
    if (self.rol !== 'UTILITY') {
      const noSupport = equipo.filter(j => j.rol !== 'UTILITY');
      const valoresCs  = noSupport.map(j => j.cs_por_min || 0);
      const maxCs = Math.max(...valoresCs), minCs = Math.min(...valoresCs);
      if (maxCs !== minCs) {
        const propioCs = self.cs_por_min || 0;
        if (propioCs === maxCs) badges.push({ tipo:'good', icono:'🌾', label:'Mejor farmeo del equipo' });
        else if (propioCs === minCs) badges.push({ tipo:'bad', icono:'🐌', label:'Peor farmeo del equipo' });
      }
    }

    evaluar('vision',j => j.vision||0,              '👁️', 'Mejor visión del equipo', '🙈', 'Peor visión del equipo');
    evaluar('oro',   j => j.oro||0,                 '💰', 'Más oro del equipo',      '🪙', 'Menos oro del equipo');
    evaluar('kda',   j => (j.kills + j.asistencias) / Math.max(1, j.muertes), '📊', 'Mejor KDA del equipo', '📉', 'Peor KDA del equipo');
    evaluar('muertes', j => -(j.muertes||0),        '🛡️', 'Menos muertes del equipo', '💀', 'Más muertes del equipo');

    return badges;
  }
});
</script>
