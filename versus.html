<style>
  :root {
    --bg:#0a0a0c; --panel:#131317; --panel-2:#18181d;
    --border:#232329; --text:#ffffff; --text-faint:#a1a1aa;
    --accent:#8b5cf6; --accent-soft:#a78bfa;
    --accent-glow:rgba(139,92,246,.35);
    --gold:#fbbf24; --win:#34d399; --loss:#f87171;
    --radius:16px;
  }
  * { box-sizing:border-box; }

  /* Scrollbar personalizado — reemplaza el feo scrollbar blanco nativo del
     sistema (Windows/etc) por uno delgado y oscuro que combina con el resto
     del sitio. */
  * { scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  *::-webkit-scrollbar { width:10px; height:10px; }
  *::-webkit-scrollbar-track { background:transparent; }
  *::-webkit-scrollbar-thumb { background-color:var(--border); border-radius:8px; border:2px solid var(--bg); background-clip:padding-box; }
  *::-webkit-scrollbar-thumb:hover { background-color:var(--accent); }
  *::-webkit-scrollbar-corner { background:transparent; }

  body {
    margin:0;
    background: radial-gradient(1200px 400px at 50% -10%, rgba(139,92,246,.10), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
  }
  .wrap { max-width:960px; margin:0 auto; padding:40px 20px 80px; }

  /* TOPBAR */
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:40px; flex-wrap:wrap; gap:12px; }
  .back-btn { display:inline-flex; align-items:center; gap:6px; color:var(--accent-soft); text-decoration:none; font-weight:600; font-size:14px; transition:color .2s; }
  .back-btn:hover { color:#fff; }
  .page-title { font-size:clamp(22px,4vw,32px); font-weight:900; margin:0; letter-spacing:-.02em; }
  .page-title span { color:var(--accent-soft); }

  /* SELECTORES */
  .selectors { display:grid; grid-template-columns:1fr 64px 1fr; align-items:center; gap:16px; margin-bottom:40px; }
  .selector-side { display:flex; flex-direction:column; gap:8px; }
  .selector-side label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); }
  .selector-side select {
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    padding:12px 16px; border-radius:10px; font-family:inherit; font-size:14px;
    font-weight:600; cursor:pointer; outline:none; width:100%;
    transition:border-color .2s;
  }
  .selector-side select:focus { border-color:var(--accent); }
  .vs-badge {
    text-align:center; font-size:22px; font-weight:900; color:var(--accent-soft);
    background:var(--panel); border:1px solid var(--border);
    border-radius:50%; width:56px; height:56px; display:flex;
    align-items:center; justify-content:center; margin:0 auto;
    box-shadow:0 0 20px var(--accent-glow);
  }

  /* TARJETAS ENFRENTADAS */
  .versus-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:32px; }

  .player-card {
    background:var(--panel); border:2px solid var(--border);
    border-radius:var(--radius); overflow:hidden;
    transition:border-color .3s;
    position:relative;
  }
  .player-card.winner { border-color:var(--accent); box-shadow:0 0 30px var(--accent-glow); }
  .player-card.loser  { opacity:.75; }

  .card-splash {
    position:relative; height:160px; overflow:hidden;
  }
  .card-splash img.splash-img {
    width:100%; height:100%; object-fit:cover; object-position:center 20%;
    opacity:.5; display:block;
  }
  .card-splash .splash-overlay {
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 0%, var(--panel) 100%);
  }
  /* avatar fuera del overflow:hidden — lo movemos al card-body */
  .avatar-wrapper {
    display:flex; justify-content:center;
    margin-top:-36px; margin-bottom:12px; position:relative; z-index:2;
  }
  .splash-avatar {
    width:72px; height:72px; border-radius:18px;
    border:3px solid var(--accent); object-fit:cover;
    display:block;
  }

  .card-body { padding:0 20px 24px; text-align:center; }
  .card-name { font-size:17px; font-weight:800; margin:0 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-tier { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin-bottom:16px; }
  .card-tier img { width:22px; height:22px; object-fit:contain; }
  .card-lp { font-size:28px; font-weight:900; color:var(--gold); margin:0 0 2px; }
  .card-wr { font-size:13px; color:var(--text-faint); font-weight:600; margin:0 0 16px; }

  .card-champ { display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; color:var(--text-faint); font-weight:600; }
  .card-champ img { width:28px; height:28px; border-radius:6px; object-fit:cover; }

  .winner-crown {
    position:absolute; top:10px; right:10px;
    font-size:20px; z-index:3;
    filter:drop-shadow(0 0 8px rgba(251,191,36,.8));
  }

  /* STATS COMPARACIÓN */
  .stats-section {
    background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:36px 32px;
  }
  .stats-section h3 {
    margin:0 0 28px; font-size:16px; font-weight:900;
    text-transform:uppercase; letter-spacing:.08em;
    color:#fff; text-align:center;
  }

  /*
    Layout de cada fila (horizontal, todo en una línea):
    [barra-izq] [valor-izq] [LABEL] [valor-der] [barra-der]
    grid: barra(flex) | val fijo | label fijo | val fijo | barra(flex)
  */
  .stat-row {
    display:grid;
    grid-template-columns: 1fr 60px 130px 60px 1fr;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .stat-row:last-child { border-bottom:none; }

  /* Barra izquierda — crece de derecha a izquierda */
  .bar-left {
    height:6px; background:var(--panel-2); border-radius:99px;
    overflow:hidden; display:flex; justify-content:flex-end;
  }
  /* Barra derecha — crece de izquierda a derecha */
  .bar-right {
    height:6px; background:var(--panel-2); border-radius:99px;
    overflow:hidden;
  }
  .bar-fill {
    height:100%; border-radius:99px;
    background:var(--accent); transition:width .6s ease;
  }
  .bar-fill.winner-bar { background:var(--win); }

  /* Valores */
  .stat-val {
    font-size:14px; font-weight:800; white-space:nowrap;
  }
  .stat-val.left  { text-align:right; }
  .stat-val.right { text-align:left; }
  .stat-val.highlight { color:var(--win); }
  .stat-val.dim       { color:var(--text-faint); font-weight:600; }

  /* Label central — ancho fijo igual para todos */
  .stat-label {
    font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; color:var(--text-faint);
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:6px; padding:6px 8px;
    text-align:center; white-space:normal;
    word-break:break-word; line-height:1.3;
  }

  /* SCORE FINAL */
  .score-banner {
    margin-top:24px; padding:20px 24px;
    background:linear-gradient(135deg, rgba(139,92,246,.15), rgba(139,92,246,.05));
    border:1px solid var(--accent); border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center; gap:20px;
    flex-wrap:wrap; text-align:center;
  }
  .score-num { font-size:42px; font-weight:900; line-height:1; }
  .score-num.left { color:var(--accent-soft); }
  .score-num.right { color:var(--text-faint); }
  .score-dash { font-size:28px; font-weight:900; color:var(--border); }
  .score-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-top:4px; }
  .score-winner-name { font-size:14px; font-weight:800; color:var(--accent-soft); margin-top:8px; }

  /* EMPTY */
  .empty-state { text-align:center; padding:60px 20px; color:var(--text-faint); font-size:14px; }

  /* RESPONSIVE */
  @media(max-width:600px){
    .versus-grid { grid-template-columns:1fr; gap:16px; }
    .selectors { grid-template-columns:1fr; gap:12px; }
    .vs-badge { margin:0; width:44px; height:44px; font-size:16px; }
    .stat-row { grid-template-columns:1fr auto 1fr; gap:6px; }
    .stat-val { font-size:13px; }
  }

  .site-footer{ margin-top:60px; padding-top:40px; border-top:1px solid var(--border); text-align:center; display:flex; flex-direction:column; align-items:center; }
  .footer-logo{ width:70px; height:auto; margin-bottom:12px; }
  .site-footer p{ margin:0; font-size:14px; color:var(--text-faint); font-weight:500; }

  /* Menú flotante desplegable — un botón, se abre en burbujas hacia arriba */
  .fab-menu{ position:fixed; right:28px; bottom:28px; z-index:999; display:flex; flex-direction:column; align-items:flex-end; gap:14px; }
  .fab-main{
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:26px; font-weight:400; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 24px rgba(139,92,246,.55);
    transition:transform .25s ease, box-shadow .2s ease;
  }
  .fab-main:hover{ box-shadow:0 6px 32px rgba(139,92,246,.75); }
  .fab-menu.open .fab-main{ transform:rotate(45deg); }
  .fab-options{ display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
  .fab-option{
    display:flex; align-items:center; gap:10px; text-decoration:none;
    opacity:0; transform:translateY(10px) scale(.85); pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .fab-menu.open .fab-option{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .fab-menu.open .fab-option:nth-child(1){ transition-delay:.06s; }
  .fab-menu.open .fab-option:nth-child(2){ transition-delay:.03s; }
  .fab-menu.open .fab-option:nth-child(3){ transition-delay:0s; }
  .fab-option-icon{
    width:46px; height:46px; border-radius:50%; background:var(--panel-2);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:0 4px 16px rgba(0,0,0,.45); flex-shrink:0;
  }
  .fab-option-label{
    font-size:12px; font-weight:700; color:var(--text); background:var(--panel-2);
    padding:5px 10px; border-radius:8px; border:1px solid var(--border);
    white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
</style>

})();

<script>
const DDRAGON       = 'https://ddragon.leagueoflegends.com/cdn/16.16.1';
const MINI_CREST    = 'https://raw.communitydragon.org/14.10/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-mini-crests/';
const VALID_TIERS   = ['iron','bronze','silver','gold','platinum','emerald','diamond','master','grandmaster','challenger'];
const TIER_ORDER    = ['IRON','BRONZE','SILVER','GOLD','PLATINUM','EMERALD','DIAMOND','MASTER','GRANDMASTER','CHALLENGER'];
const DIVISIONLESS  = ['MASTER','GRANDMASTER','CHALLENGER'];
const DIV_NUM       = { 'IV':0,'III':1,'II':2,'I':3 };

let allPlayers = [];

function eloScore(rango, division, lp) {
  const tier = (rango || '').toUpperCase();
  const ti = TIER_ORDER.indexOf(tier);
  if (ti === -1) return 0;
  if (DIVISIONLESS.includes(tier)) return 7*4*100 + Math.max(0, lp||0);
  const dn = DIV_NUM[(division||'').toUpperCase()];
  if (dn === undefined) return 0;
  return (ti*4+dn)*100 + Math.max(0, Math.min(100, lp||0));
}

function avatarUrl(iconId)  { return `${DDRAGON}/img/profileicon/${iconId}.png`; }
function champSplash(name)  { return `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${name}_0.jpg`; }
function champIcon(name)    { return `${DDRAGON}/img/champion/${name}.png`; }
function crestUrl(rango)    {
  const t = (rango||'unranked').split(' ')[0].toLowerCase();
  return `${MINI_CREST}${VALID_TIERS.includes(t) ? t : 'unranked'}.png`;
}
// FIX: DDragon es sensible a mayúsculas/minúsculas en el nombre de archivo,
// y en un puñado de campeones el "championName" que guarda la API de Riot
// no coincide exactamente con el nombre real del archivo en DDragon. El
// caso clásico es FiddleSticks: Riot lo guarda como "FiddleSticks" (S
// mayúscula) pero el ícono real es "Fiddlesticks.png" (s minúscula).
const CHAMPION_ID_OVERRIDES = { FiddleSticks: 'Fiddlesticks' };
function cleanChamp(name)   {
  const clean = (name||'').replace(/[^a-zA-Z0-9]/g,'');
  return CHAMPION_ID_OVERRIDES[clean] || clean;
}

async function loadData() {
  // FIX: raw.githubusercontent.com en vez de jsDelivr — más confiable y sin caché de horas.
  const CDN = 'https://raw.githubusercontent.com/KyoSharkCode/SoloQApuesta/main';
  const res = await fetch(`${CDN}/datos.json?t=${Date.now()}`, { cache:'no-store' });
  const raw = await res.json();
  const list = Array.isArray(raw) ? raw : (raw.jugadores || []);
  allPlayers = list.map(p => {
    const parts = (p.rango||'Unranked').split(' ');
    return {
      id: p.nombre, nombre: p.nombre, icono: p.icono||1,
      rango: parts[0], division: parts.slice(1).join(' '),
      lp: p.lp||0, winrate: parseInt(p.winrate)||0,
      rol: p.rol_principal||'N/A',
      maestrias: p.maestrias||[],
      historial: p.historial||[],
      killsSemana: p.kills_semana||0,
      pentakillsSemana: p.pentakills_semana||0,
      visionSemana: p.vision_promedio_semana||0,
      kdaSemana: p.kda_promedio_semana||0,
      kdaPerfecto: !!p.kda_perfecto_semana,
      primerasSangre: p.primeras_sangre_semana||0,
      campeonesGanados: p.campeones_ganados_semana||0,
    };
  }).sort((a,b) => eloScore(b.rango,b.division,b.lp) - eloScore(a.rango,a.division,a.lp));
  populateSelects();
}

function populateSelects() {
  const selL = document.getElementById('sel-left');
  const selR = document.getElementById('sel-right');
  allPlayers.forEach(p => {
    selL.innerHTML += `<option value="${p.id}">${p.nombre}</option>`;
    selR.innerHTML += `<option value="${p.id}">${p.nombre}</option>`;
  });
  selL.addEventListener('change', render);
  selR.addEventListener('change', render);
}

function render() {
  const idL = document.getElementById('sel-left').value;
  const idR = document.getElementById('sel-right').value;
  const content  = document.getElementById('versus-content');
  const empty    = document.getElementById('empty-state');

  if (!idL || !idR || idL === idR) {
    content.style.display = 'none';
    empty.style.display   = 'block';
    empty.textContent     = (!idL || !idR) ? 'Selecciona dos jugadores para ver la batalla. ⚔️' : 'Selecciona dos jugadores distintos.';
    return;
  }

  const pL = allPlayers.find(p => p.id === idL);
  const pR = allPlayers.find(p => p.id === idR);
  if (!pL || !pR) return;

  content.style.display = 'block';
  empty.style.display   = 'none';

  fillCard('left',  pL);
  fillCard('right', pR);
  fillStats(pL, pR);
}

function fillCard(side, p) {
  const topChamp = p.maestrias.length ? cleanChamp(p.maestrias[0].campeon) : null;
  const tierPretty = p.rango.charAt(0) + p.rango.slice(1).toLowerCase();
  const rankDisplay = DIVISIONLESS.includes(p.rango.toUpperCase()) ? tierPretty : `${tierPretty} ${p.division}`;

  document.getElementById(`splash-${side}`).src     = topChamp ? champSplash(topChamp) : '';
  document.getElementById(`avatar-${side}`).src     = avatarUrl(p.icono);
  document.getElementById(`name-${side}`).textContent  = p.nombre.split('#')[0];
  document.getElementById(`crest-${side}`).src      = crestUrl(p.rango);
  document.getElementById(`tier-${side}`).textContent  = rankDisplay;
  document.getElementById(`lp-${side}`).textContent    = `${p.lp} LP`;
  document.getElementById(`wr-${side}`).textContent    = `${p.winrate}% WR`;

  if (topChamp) {
    document.getElementById(`champ-${side}`).src    = champIcon(topChamp);
    document.getElementById(`champ-name-${side}`).textContent = p.maestrias[0].campeon;
  }
}

function fillStats(pL, pR) {
  const scoreL = eloScore(pL.rango, pL.division, pL.lp);
  const scoreR = eloScore(pR.rango, pR.division, pR.lp);

  const stats = [
    { label:'Elo Score',       vL: scoreL,              vR: scoreR,              fmt: v => v,                          higher:'left'  },
    { label:'LP',              vL: pL.lp,               vR: pR.lp,               fmt: v => `${v} LP`,                  higher:'left'  },
    { label:'Winrate',         vL: pL.winrate,          vR: pR.winrate,          fmt: v => `${v}%`,                    higher:'left'  },
    { label:'Kills semana',    vL: pL.killsSemana,      vR: pR.killsSemana,      fmt: v => v,                          higher:'left'  },
    { label:'Pentakills',      vL: pL.pentakillsSemana, vR: pR.pentakillsSemana, fmt: v => v,                          higher:'left'  },
    { label:'KDA semana',      vL: pL.kdaSemana,        vR: pR.kdaSemana,        fmt: (v,p) => p.kdaPerfecto ? '∞' : v, higher:'left', perfectL: pL.kdaPerfecto, perfectR: pR.kdaPerfecto },
    { label:'Visión prom.',    vL: pL.visionSemana,     vR: pR.visionSemana,     fmt: v => v,                          higher:'left'  },
    { label:'Primeras sangre', vL: pL.primerasSangre,   vR: pR.primerasSangre,   fmt: v => v,                          higher:'left'  },
    { label:'Pool semana',       vL: pL.campeonesGanados, vR: pR.campeonesGanados, fmt: v => v,                        higher:'left'  },
  ];

  let winsL = 0, winsR = 0;
  let html = '';

  stats.forEach(s => {
    const numL = typeof s.vL === 'number' ? s.vL : 0;
    const numR = typeof s.vR === 'number' ? s.vR : 0;
    // KDA perfecto gana siempre; si los dos son perfectos, empate
    let winnerSide;
    if (s.perfectL && s.perfectR) winnerSide = 'tie';
    else if (s.perfectL)          winnerSide = 'left';
    else if (s.perfectR)          winnerSide = 'right';
    else winnerSide = numL > numR ? 'left' : numL < numR ? 'right' : 'tie';
    if (winnerSide === 'left')  winsL++;
    if (winnerSide === 'right') winsR++;

    const fmtL = typeof s.fmt === 'function' ? s.fmt(s.vL, pL) : s.vL;
    const fmtR = typeof s.fmt === 'function' ? s.fmt(s.vR, pR) : s.vR;

    // KDA perfecto: forzar barra al 100% para el perfecto, 0% para el otro
    let pctL, pctR;
    if (s.perfectL || s.perfectR) {
      pctL = s.perfectL ? 100 : (s.perfectR ? 0 : 50);
      pctR = s.perfectR ? 100 : (s.perfectL ? 0 : 50);
    } else {
      const maxVal = Math.max(numL, numR, 1);
      pctL = Math.round((numL / maxVal) * 100);
      pctR = Math.round((numR / maxVal) * 100);
    }
    const isWinL = winnerSide === 'left';
    const isWinR = winnerSide === 'right';

    const clsL = isWinL ? 'highlight' : winnerSide === 'tie' ? '' : 'dim';
    const clsR = isWinR ? 'highlight' : winnerSide === 'tie' ? '' : 'dim';
    // Layout: [barra-izq] [valor-izq] [LABEL] [valor-der] [barra-der]
    html += `
      <div class="stat-row">
        <div class="bar-left">
          <div class="bar-fill ${isWinL ? 'winner-bar' : ''}" style="width:${pctL}%"></div>
        </div>
        <span class="stat-val left ${clsL}">${fmtL}</span>
        <div class="stat-label">${s.label}</div>
        <span class="stat-val right ${clsR}">${fmtR}</span>
        <div class="bar-right">
          <div class="bar-fill ${isWinR ? 'winner-bar' : ''}" style="width:${pctR}%"></div>
        </div>
      </div>`;
  });

  document.getElementById('stats-rows').innerHTML = html;

  // Score final y ganador de tarjetas
  document.getElementById('score-left').textContent       = winsL;
  document.getElementById('score-right').textContent      = winsR;
  document.getElementById('score-label-left').textContent  = pL.nombre.split('#')[0];
  document.getElementById('score-label-right').textContent = pR.nombre.split('#')[0];

  const cardL = document.getElementById('card-left');
  const cardR = document.getElementById('card-right');
  const crownL = document.getElementById('crown-left');
  const crownR = document.getElementById('crown-right');
  cardL.classList.remove('winner','loser');
  cardR.classList.remove('winner','loser');
  document.querySelectorAll('.winner-crown').forEach(e => e.remove());

  const winText = document.getElementById('score-winner-text');
  if (winsL > winsR) {
    cardL.classList.add('winner'); cardR.classList.add('loser');
    cardL.insertAdjacentHTML('beforeend', '<div class="winner-crown">👑</div>');
    winText.textContent = `👑 ${pL.nombre.split('#')[0]} gana el enfrentamiento`;
  } else if (winsR > winsL) {
    cardR.classList.add('winner'); cardL.classList.add('loser');
    cardR.insertAdjacentHTML('beforeend', '<div class="winner-crown">👑</div>');
    winText.textContent = `👑 ${pR.nombre.split('#')[0]} gana el enfrentamiento`;
  } else {
    winText.textContent = '🤝 Empate total — están igualados stat a stat';
  }
}

loadData().catch(() => {
  document.getElementById('empty-state').textContent = 'No se pudieron cargar los datos. Asegúrate de que datos.json existe.';
});
</script>
