<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo LoL · Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="shortcut icon" href="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/764bbd9c-6d80-481d-8136-96848f01e843/ddx6q22-c6936a5b-73d6-409d-b248-0b370494f90f.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi83NjRiYmQ5Yy02ZDgwLTQ4MWQtODEzNi05Njg0OGYwMWU4NDMvZGR4NnEyMi1jNjkzNmE1Yi03M2Q2LTQwOWQtYjI0OC0wYjM3MDQ5NGY5MGYucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.5gC4gH1VsNiJXARJGlpuWTYklhg8sRjJiXKO7IpdYeQ" type=image/x.icon" alt="logo">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root{
    --bg:#0a0a0c; --panel:#131317; --panel-2:#18181d;
    --border:#232329; --text:#ffffff; --text-dim:#9a9aa3;
    --text-faint:#a1a1aa; --accent:#8b5cf6; --accent-soft:#a78bfa;
    --accent-glow:rgba(139,92,246,.35); --gold:#fbbf24;
    --win:#34d399; --win-bg:rgba(52,211,153,.12);
    --loss:#f87171; --loss-bg:rgba(248,113,113,.12);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background: radial-gradient(1200px 500px at 50% -10%, rgba(139,92,246,.10), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
  }
  button { font-family: inherit; color: var(--text); }
  .wrap{ max-width:960px; margin:0 auto; padding:48px 20px 80px; }

  header{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; margin-bottom:30px; padding-bottom:24px; border-bottom:1px solid var(--border); }
  h1{ font-size:clamp(28px,4vw,38px); font-weight:800; margin:0; color: #ffffff;}
  
  .top1-card { display: flex; align-items: center; gap: 20px; background: var(--panel); border: 1px solid var(--accent); padding: 24px; border-radius: var(--radius); margin-bottom: 50px; box-shadow: 0 0 30px var(--accent-glow); position: relative; overflow: hidden;}
  .top1-badge { position: absolute; top: 0; left: 0; background: var(--accent); color: white; font-weight: 800; font-size: 11px; padding: 4px 12px; border-bottom-right-radius: 8px; text-transform: uppercase; letter-spacing: 0.1em; }
  .top1-avatar { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--accent-soft); object-fit: cover; }
  .top1-info h3 { margin: 0 0 4px 0; font-size: 22px; font-weight: 800; color: #ffffff;}
  .top1-info p { margin: 0; color: var(--text-faint); font-size: 14px; font-weight: 500; }
  .top1-stats { margin-left: auto; text-align: right; }
  .top1-stats .lp { font-size: 28px; font-weight: 900; color: var(--gold); margin: 0 0 4px 0; }
  .top1-stats .tier { font-size: 14px; color: var(--text-faint); font-weight: 600; text-transform: uppercase; }

  .filter-bar { display:flex; justify-content:space-between; align-items: center; margin-bottom: 18px;}
  .filter-bar select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 13px; cursor: pointer; outline: none; }
  
  .section-title h2{ font-size:15px; font-weight:700; text-transform:uppercase; margin:0; color: #ffffff;}
  .section-title span{ font-size:12px; color:var(--text-faint); }
  section{margin-bottom:52px;}

  .ranking{ display:flex; flex-direction:column; gap:6px; }
  .rank-head, .rank-row{ display:grid; grid-template-columns:40px 1fr 100px 120px 90px 120px; gap:12px; align-items:center; }
  .rank-head{ padding:0 16px 10px; font-size:11px; font-weight:600; text-transform:uppercase; color:var(--text-faint); }
  
  .rank-row{ padding:12px 16px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:all .15s ease; color: var(--text); text-align: left; }
  .rank-row:hover{ border-color:#33333c; transform:translateY(-1px); }
  .rank-row.active{ border-color:var(--accent); background:linear-gradient(180deg, rgba(139,92,246,.10), rgba(139,92,246,.03)); }
  
  .rank-pos{ font-size:13px; font-weight:700; color:var(--text-faint); text-align:center; }
  .player-cell{ display:flex; align-items:center; gap:12px; }
  .avatar{ width:34px; height:34px; border-radius:9px; border:1px solid var(--border); object-fit:cover; }
  
  /* NUEVO: Enlace de perfil */
  .profile-link { font-size:14px; font-weight:700; color: #ffffff; text-decoration: none; transition: color 0.2s; position: relative; z-index: 10; padding: 4px 8px; border-radius: 6px;}
  .profile-link:hover { color: var(--accent-soft); background: rgba(139,92,246,.15); text-decoration: underline; }
  
  .role-badge{ font-size:12px; color:#ffffff; font-weight: 700; background: rgba(139,92,246,0.3); padding: 4px 8px; border-radius: 6px; text-align: center; }
  .tier-badge{ display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color: #ffffff;}
  .tier-crest{ width:16px; height:16px; transform:rotate(45deg); border-radius:4px; background:#5b5c63; }
  .lp-cell{ font-size:13px; font-weight:600; color:#ffffff; }
  
  .wr-cell{ display:flex; flex-direction:column; gap:5px; }
  .wr-top{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-faint); }
  .wr-bar{ height:4px; background:var(--panel-2); border-radius:99px; overflow:hidden; }
  .wr-fill{ height:100%; background:linear-gradient(90deg,var(--accent-soft),var(--accent)); border-radius:99px; }

  .tier-iron .tier-crest{background:#5b5c63;} .tier-bronze .tier-crest{background:#a9754f;} .tier-silver .tier-crest{background:#9fb0c2;}
  .tier-gold .tier-crest{background:#d8ad3d;} .tier-platinum .tier-crest{background:#3fc6b6;} .tier-emerald .tier-crest{background:#3fcf7f;}
  .tier-diamond .tier-crest{background:#6f8bff;} .tier-master .tier-crest{background:#b154e8;} .tier-grandmaster .tier-crest{background:#e5484d;}
  .tier-challenger .tier-crest{background:linear-gradient(135deg,#8ce6e0,#f4d160);}

  .history-panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
  .matches{ display:flex; flex-direction:column; gap:8px; }
  .match{ display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:14px; padding:10px 12px; border-radius:10px; background:var(--panel-2); border:1px solid var(--border); }
  .champ-icon{ width:36px; height:36px; border-radius:8px; object-fit:cover; background:#1d1d24; }
  .match-champ{ font-size:13px; font-weight:700; color: #ffffff;}
  .match-kda{ font-size:12px; color:var(--text-faint); }
  .result-chip{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; text-transform:uppercase; text-align: center; }
  .result-chip.victoria{ color:var(--win); background:var(--win-bg); }
  .result-chip.derrota{ color:var(--loss); background:var(--loss-bg); }
  .empty-state{ color:var(--text-faint); font-size:13px; text-align:center; padding:30px 0; }
  .chart-panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; height:350px; }
  .countdown-container { text-align: center; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 20px; }
  .countdown-container h2 { margin: 0 0 20px 0; font-size: 20px; font-weight: 800; letter-spacing: 0.05em; color: var(--accent-soft); text-transform: uppercase;}
  .timer-boxes { display: flex; justify-content: center; gap: 15px; }
  .timer-box { background: var(--panel-2); border: 1px solid var(--border); padding: 15px 20px; border-radius: 12px; min-width: 90px; }
  .timer-val { font-size: 32px; font-weight: 900; line-height: 1; margin-bottom: 5px; color: #ffffff; }
  .timer-label { font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; }

</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1 id="titulo">Torneo entre Amigos</h1>
    </div>
  </header>

  <div id="top1-container"></div>

  <section id="seccion-ranking">
    <div class="filter-bar">
      <div class="section-title" style="margin:0;">
        <h2>Ranking Global</h2>
      </div>
      <select id="elo-filter">
        <option value="ALL">Todos los Elos</option>
        <option value="CHALLENGER">Challenger</option>
        <option value="GRANDMASTER">Grandmaster</option>
        <option value="MASTER">Master</option>
        <option value="DIAMOND">Diamond</option>
        <option value="EMERALD">Emerald</option>
        <option value="PLATINUM">Platinum</option>
        <option value="GOLD">Gold</option>
        <option value="SILVER">Silver</option>
        <option value="BRONZE">Bronze</option>
        <option value="IRON">Iron</option>
      </select>
    </div>
    <div class="rank-head">
      <span>#</span> <span>Jugador</span> <span>Rol (10p)</span> <span>Rango</span> <span>LP</span> <span>Winrate</span>
    </div>
    <div class="ranking" id="ranking-list"></div>
  </section>

  <section id="seccion-historial">
    <div class="section-title">
      <h2>Historial Individual</h2>
      <span>Últimas 10 partidas Solo/Duo</span>
    </div>
    <div class="history-panel" id="history-panel">
      <p class="empty-state">Haz clic en la fila de un jugador para ver su historial rápido.</p>
    </div>
  </section>

  <section id="seccion-grafica">
    <div class="section-title">
      <h2>Progreso General de LPs</h2>
      <span>29 Jul 2026 - 1 Ene 2027</span>
    </div>
    <div class="chart-panel">
      <canvas id="lp-chart"></canvas>
    </div>
  </section>

  <div class="countdown-container">
    <h2>⏳ Fin de Temporada</h2>
    <div class="timer-boxes" id="countdown">
      <div class="timer-box"><div class="timer-val" id="cd-days">0</div><div class="timer-label">Días</div></div>
      <div class="timer-box"><div class="timer-val" id="cd-hours">0</div><div class="timer-label">Horas</div></div>
      <div class="timer-box"><div class="timer-val" id="cd-mins">0</div><div class="timer-label">Min</div></div>
      <div class="timer-box"><div class="timer-val" id="cd-secs">0</div><div class="timer-label">Seg</div></div>
    </div>
  </div>
</div>

<script>
window.addEventListener('load', () => {
  const TIER_ORDER = ['IRON','BRONZE','SILVER','GOLD','PLATINUM','EMERALD','DIAMOND','MASTER','GRANDMASTER','CHALLENGER'];
  const DIVISIONLESS = ['MASTER','GRANDMASTER','CHALLENGER'];

  const state = { players: [], selectedId: null, filterElo: 'ALL', chart: null };

  const top1ContainerEl = document.getElementById('top1-container');
  const rankingListEl = document.getElementById('ranking-list');
  const historyPanelEl = document.getElementById('history-panel');
  const eloFilterEl = document.getElementById('elo-filter');
  
  init();
  startCountdown();

  async function init(){
    try{
      const res = await fetch('datos.json', { cache: 'no-store' });
      if(!res.ok) throw new Error();
      const rawData = await res.json();
      const rawPlayers = Array.isArray(rawData) ? rawData : (rawData.jugadores || []);
      
      state.players = rawPlayers.map(p => {
        const rankParts = (p.rango || 'Unranked').split(' ');
        return {
          id: p.nombre, nombre: p.nombre, icono: p.icono || 1,
          rango: rankParts[0], division: rankParts.slice(1).join(' '),
          lp: p.lp || 0, winrate: parseInt(p.winrate) || 0, rol: p.rol_principal || 'N/A',
          partidas: (p.historial || []).map(h => ({
            campeon: h.campeon, kda: h.kda, resultado: (h.resultado || '').toLowerCase(), duracion: h.duracion
          })),
          historialLP: p.progreso_lp || []
        };
      }).sort((a,b) => rankScore(b) - rankScore(a));

      eloFilterEl.addEventListener('change', (e) => {
        state.filterElo = e.target.value;
        renderRanking();
      });

      renderTop1();
      renderRanking();
      buildChart();
      if(state.players.length) selectPlayer(state.players[0].id);

    }catch(err){
      rankingListEl.innerHTML = `<p class="empty-state">Espera a que el bot recolecte la información en un par de minutos y recarga la página.</p>`;
    }
  }

  function rankScore(p){
    const ti = TIER_ORDER.indexOf((p.rango || '').toUpperCase());
    if(DIVISIONLESS.includes((p.rango || '').toUpperCase())) return ti * 100000 + (p.lp || 0);
    const divNum = { 'IV':1,'III':2,'II':3,'I':4 }[p.division] || 0;
    return ti * 100000 + divNum * 2000 + (p.lp || 0);
  }

  function getAvatarUrl(iconId) { return `https://ddragon.leagueoflegends.com/cdn/14.20.1/img/profileicon/${iconId}.png`; }

  function renderTop1() {
    if (state.players.length === 0) return;
    const topPlayer = state.players[0]; 
    const tierPretty = topPlayer.rango.charAt(0) + topPlayer.rango.slice(1).toLowerCase();
    const rankDisplay = DIVISIONLESS.includes((topPlayer.rango || '').toUpperCase()) ? tierPretty : `${tierPretty} ${topPlayer.division}`;

    top1ContainerEl.innerHTML = `
      <div class="top1-card">
        <div class="top1-badge">Top 1 Actual</div>
        <img class="top1-avatar" src="${getAvatarUrl(topPlayer.icono)}" alt="Avatar">
        <div class="top1-info">
          <h3><a href="perfil.html?jugador=${encodeURIComponent(topPlayer.id)}" class="profile-link" style="padding:0;">${topPlayer.nombre}</a></h3>
          <p>Dominando la grieta como ${topPlayer.rol}</p>
        </div>
        <div class="top1-stats">
          <p class="lp">${topPlayer.lp} LP</p>
          <p class="tier">${rankDisplay}</p>
        </div>
      </div>
    `;
  }

  function renderRanking(){
    rankingListEl.innerHTML = '';
    const filtrados = state.players.filter(p => state.filterElo === 'ALL' || (p.rango || '').toUpperCase() === state.filterElo);

    if(filtrados.length === 0){
      rankingListEl.innerHTML = `<p class="empty-state">Nadie está en este elo todavía.</p>`;
      return;
    }

    filtrados.forEach((p, i) => {
      const row = document.createElement('button');
      row.className = 'rank-row' + (p.id === state.selectedId ? ' active' : '');
      
      // Al hacer click en la FILA muestra el historial rápido
      row.addEventListener('click', (e) => {
        // Evitamos que active el historial si hicieron click justo en el enlace del nombre
        if (e.target.tagName.toLowerCase() !== 'a') { selectPlayer(p.id); }
      });

      const tierPretty = p.rango.charAt(0) + p.rango.slice(1).toLowerCase();
      const rankDisplay = DIVISIONLESS.includes((p.rango || '').toUpperCase()) ? tierPretty : `${tierPretty} ${p.division}`;

      row.innerHTML = `
        <span class="rank-pos">${i + 1}</span>
        <span class="player-cell">
          <img class="avatar" src="${getAvatarUrl(p.icono)}" alt="Icon">
          <a href="perfil.html?jugador=${encodeURIComponent(p.id)}" class="profile-link">${p.nombre}</a>
        </span>
        <span class="role-badge">${p.rol}</span>
        <span class="tier-badge tier-${(p.rango || '').toLowerCase()}">
          <span class="tier-crest"></span> <span class="tier-label">${rankDisplay}</span>
        </span>
        <span class="lp-cell">${p.lp} LP</span>
        <span class="wr-cell">
          <span class="wr-top"><span>${p.winrate}% WR</span></span>
          <span class="wr-bar"><span class="wr-fill" style="width:${p.winrate}%"></span></span>
        </span>
      `;
      rankingListEl.appendChild(row);
    });
  }

  function selectPlayer(id){
    state.selectedId = id;
    renderRanking();
    const player = state.players.find(p => p.id === id);
    const matchesHtml = player.partidas.map(m => `
      <div class="match">
        <img class="champ-icon" src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${m.campeon.replace(/[^a-zA-Z0-9]/g,'')}.png" onerror="this.style.visibility='hidden'">
        <span>
          <div class="match-champ">${m.campeon}</div>
          <div class="match-kda">${m.kda} KDA</div>
        </span>
        <span class="result-chip ${m.resultado}">${m.resultado === 'victoria' ? 'Victoria' : 'Derrota'}</span>
      </div>
    `).join('');
    historyPanelEl.innerHTML = `<div class="matches">${matchesHtml}</div>`;
  }

  function buildChart(){
    const palette = ['#8b5cf6','#38bdf8','#34d399','#f472b6','#fbbf24','#f87171','#a78bfa','#60a5fa'];
    const datasets = state.players.map((p, i) => {
      const dataPoints = p.historialLP.filter(pt => pt.fecha).map(pt => ({ x: new Date(pt.fecha).getTime(), y: pt.lp }));
      return {
        label: p.nombre, data: dataPoints, borderColor: palette[i % palette.length],
        backgroundColor: palette[i % palette.length], borderWidth: 2, tension: 0.3, spanGaps: true
      };
    });

    new Chart(document.getElementById('lp-chart').getContext('2d'), {
      type: 'line', data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { color: '#ffffff' } } },
        scales: {
          x: { type: 'time', time: { unit: 'month', displayFormats: { month: 'MMM yyyy' } }, min: '2026-07-29T00:00:00', max: '2027-01-01T23:59:59', grid: { color: '#232329' }, ticks: { color: '#a1a1aa' } },
          y: { grid: { color: '#232329' }, ticks: { color: '#a1a1aa' } },
        },
      },
    });
  }

  function startCountdown() {
    const targetDate = new Date('2027-01-01T00:00:00').getTime();
    function update() {
      const distance = targetDate - new Date().getTime();
      if (distance < 0) return;
      document.getElementById('cd-days').innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
      document.getElementById('cd-hours').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      document.getElementById('cd-mins').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      document.getElementById('cd-secs').innerText = Math.floor((distance % (1000 * 60)) / 1000);
    }
    update(); setInterval(update, 1000);
  }
});
</script>
</body>
</html>
