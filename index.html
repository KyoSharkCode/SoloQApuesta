<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo LoL · Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0a0c; --panel:#131317; --panel-2:#18181d;
    --border:#232329; --text:#f2f2f5; --text-dim:#9a9aa3;
    --text-faint:#5c5c66; --accent:#8b5cf6; --accent-soft:#a78bfa;
    --accent-glow:rgba(139,92,246,.35);
    --win:#34d399; --win-bg:rgba(52,211,153,.12);
    --loss:#f87171; --loss-bg:rgba(248,113,113,.12);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background: radial-gradient(1200px 500px at 50% -10%, rgba(139,92,246,.10), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
  }
  .wrap{ max-width:960px; margin:0 auto; padding:48px 20px 80px; }

  header{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; margin-bottom:40px; padding-bottom:24px; border-bottom:1px solid var(--border); }
  h1{ font-size:clamp(28px,4vw,38px); font-weight:800; margin:0; }
  
  .filter-bar { display:flex; justify-content:space-between; align-items: center; margin-bottom: 18px;}
  .filter-bar select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 13px; cursor: pointer; outline: none; }
  .filter-bar select:focus { border-color: var(--accent); }
  
  .section-title h2{ font-size:15px; font-weight:700; text-transform:uppercase; margin:0; }
  section{margin-bottom:52px;}

  .ranking{ display:flex; flex-direction:column; gap:6px; }
  .rank-head, .rank-row{ display:grid; grid-template-columns:40px 1fr 100px 120px 90px 120px; gap:12px; align-items:center; }
  .rank-head{ padding:0 16px 10px; font-size:11px; font-weight:600; text-transform:uppercase; color:var(--text-faint); }
  .rank-row{ padding:12px 16px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:all .15s ease; }
  .rank-row:hover{ border-color:#33333c; transform:translateY(-1px); }
  .rank-row.active{ border-color:var(--accent); background:linear-gradient(180deg, rgba(139,92,246,.10), rgba(139,92,246,.03)); }
  
  .rank-pos{ font-size:13px; font-weight:700; color:var(--text-faint); text-align:center; }
  .player-cell{ display:flex; align-items:center; gap:12px; }
  .avatar{ width:34px; height:34px; border-radius:9px; background:var(--panel-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--text-dim); }
  .player-name{ font-size:14px; font-weight:600; }
  
  .role-badge{ font-size:12px; color:var(--accent-soft); font-weight: 600; background: rgba(139,92,246,0.1); padding: 4px 8px; border-radius: 6px; text-align: center; }
  .tier-badge{ display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; }
  .tier-crest{ width:16px; height:16px; transform:rotate(45deg); border-radius:4px; background:#5b5c63; }
  .lp-cell{ font-size:13px; font-weight:600; color:var(--text-dim); }
  
  .wr-cell{ display:flex; flex-direction:column; gap:5px; }
  .wr-top{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); }
  .wr-bar{ height:4px; background:var(--panel-2); border-radius:99px; overflow:hidden; }
  .wr-fill{ height:100%; background:linear-gradient(90deg,var(--accent-soft),var(--accent)); border-radius:99px; }

  /* Colors */
  .tier-iron .tier-crest{background:#5b5c63;} .tier-bronze .tier-crest{background:#a9754f;} .tier-silver .tier-crest{background:#9fb0c2;}
  .tier-gold .tier-crest{background:#d8ad3d;} .tier-platinum .tier-crest{background:#3fc6b6;} .tier-emerald .tier-crest{background:#3fcf7f;}
  .tier-diamond .tier-crest{background:#6f8bff;} .tier-master .tier-crest{background:#b154e8;} .tier-grandmaster .tier-crest{background:#e5484d;}
  .tier-challenger .tier-crest{background:linear-gradient(135deg,#8ce6e0,#f4d160);}

  /* History */
  .history-panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
  .history-head{ display:flex; align-items:center; gap:12px; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--border); }
  .history-head h3{ margin:0; font-size:17px; font-weight:700; }
  .matches{ display:flex; flex-direction:column; gap:8px; }
  .match{ display:grid; grid-template-columns:44px 1fr auto auto; align-items:center; gap:14px; padding:10px 12px; border-radius:10px; background:var(--panel-2); border:1px solid var(--border); }
  .champ-icon{ width:36px; height:36px; border-radius:8px; object-fit:cover; background:#1d1d24; }
  .match-champ{ font-size:13px; font-weight:600; }
  .match-kda{ font-size:12px; color:var(--text-dim); }
  .lp-diff { font-size:12px; font-weight: 700; text-align: right; margin-right: 10px; }
  .lp-diff.victoria { color: var(--win); }
  .lp-diff.derrota { color: var(--loss); }
  .result-chip{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; text-transform:uppercase; }
  .result-chip.victoria{ color:var(--win); background:var(--win-bg); }
  .result-chip.derrota{ color:var(--loss); background:var(--loss-bg); }
  .empty-state{ color:var(--text-faint); font-size:13px; text-align:center; padding:30px 0; }

  /* Chart */
  .chart-panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; height:350px; }

</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1 id="titulo">Torneo entre Amigos</h1>
    </div>
  </header>

  <section id="seccion-ranking">
    <div class="filter-bar">
      <div class="section-title" style="margin:0;">
        <h2>Ranking Global</h2>
      </div>
      <select id="elo-filter">
        <option value="ALL">Todos los Elos</option>
        <option value="CHALLENGER">Challenger</option>
        <option value="GRANDMASTER">Grandmaster</option>
        <option value="MASTER">Master</option>
        <option value="DIAMOND">Diamond</option>
        <option value="EMERALD">Emerald</option>
        <option value="PLATINUM">Platinum</option>
        <option value="GOLD">Gold</option>
        <option value="SILVER">Silver</option>
        <option value="BRONZE">Bronze</option>
        <option value="IRON">Iron</option>
      </select>
    </div>
    <div class="rank-head">
      <span>#</span> <span>Jugador</span> <span>Rol (10p)</span> <span>Rango</span> <span>LP</span> <span>Winrate</span>
    </div>
    <div class="ranking" id="ranking-list"></div>
  </section>

  <section id="seccion-historial">
    <div class="section-title">
      <h2>Historial Individual</h2>
      <span>Últimas 10 partidas Solo/Duo</span>
    </div>
    <div class="history-panel" id="history-panel">
      <p class="empty-state">Selecciona un jugador del ranking.</p>
    </div>
  </section>

  <section id="seccion-grafica">
    <div class="section-title">
      <h2>Progreso General de LPs</h2>
      <span>Todos los jugadores al mismo tiempo</span>
    </div>
    <div class="chart-panel">
      <canvas id="lp-chart"></canvas>
    </div>
  </section>
</div>

<script>
window.addEventListener('load', () => {
  const TIER_ORDER = ['IRON','BRONZE','SILVER','GOLD','PLATINUM','EMERALD','DIAMOND','MASTER','GRANDMASTER','CHALLENGER'];
  const DIVISIONLESS = ['MASTER','GRANDMASTER','CHALLENGER'];

  const state = { players: [], selectedId: null, filterElo: 'ALL', chart: null };

  const rankingListEl = document.getElementById('ranking-list');
  const historyPanelEl = document.getElementById('history-panel');
  const eloFilterEl = document.getElementById('elo-filter');
  
  init();

  async function init(){
    try{
      const res = await fetch('datos.json', { cache: 'no-store' });
      if(!res.ok) throw new Error();
      const rawData = await res.json();
      const rawPlayers = Array.isArray(rawData) ? rawData : (rawData.jugadores || []);
      
      state.players = rawPlayers.map(p => {
        const rankParts = (p.rango || 'Unranked').split(' ');
        return {
          id: p.nombre, nombre: p.nombre,
          rango: rankParts[0], division: rankParts.slice(1).join(' '),
          lp: p.lp || 0, winrate: parseInt(p.winrate) || 0, 
          rol: p.rol_principal || 'N/A',
          partidas: (p.historial || []).map(h => ({
            campeon: h.campeon, kda: h.kda,
            resultado: (h.resultado || '').toLowerCase(), duracion: h.duracion
          })),
          historialLP: p.progreso_lp || []
        };
      }).sort((a,b) => rankScore(b) - rankScore(a));

      eloFilterEl.addEventListener('change', (e) => {
        state.filterElo = e.target.value;
        renderRanking();
      });

      renderRanking();
      buildChart();
      if(state.players.length) selectPlayer(state.players[0].id);

    }catch(err){
      rankingListEl.innerHTML = `<p class="empty-state">Error cargando datos.json</p>`;
    }
  }

  function rankScore(p){
    const ti = TIER_ORDER.indexOf((p.rango || '').toUpperCase());
    if(DIVISIONLESS.includes((p.rango || '').toUpperCase())) return ti * 100000 + (p.lp || 0);
    const divNum = { 'IV':1,'III':2,'II':3,'I':4 }[p.division] || 0;
    return ti * 100000 + divNum * 2000 + (p.lp || 0);
  }

  function renderRanking(){
    rankingListEl.innerHTML = '';
    
    // Filtro por ELO
    const filtrados = state.players.filter(p => 
      state.filterElo === 'ALL' || (p.rango || '').toUpperCase() === state.filterElo
    );

    if(filtrados.length === 0){
      rankingListEl.innerHTML = `<p class="empty-state">Nadie está en este elo todavía.</p>`;
      return;
    }

    filtrados.forEach((p, i) => {
      const row = document.createElement('button');
      row.className = 'rank-row' + (p.id === state.selectedId ? ' active' : '');
      row.addEventListener('click', () => selectPlayer(p.id));

      const tierPretty = p.rango.charAt(0) + p.rango.slice(1).toLowerCase();
      const rankDisplay = DIVISIONLESS.includes((p.rango || '').toUpperCase()) ? tierPretty : `${tierPretty} ${p.division}`;

      row.innerHTML = `
        <span class="rank-pos">${i + 1}</span>
        <span class="player-cell">
          <span class="player-name">${p.nombre}</span>
        </span>
        <span class="role-badge">${p.rol}</span>
        <span class="tier-badge tier-${(p.rango || '').toLowerCase()}">
          <span class="tier-crest"></span> <span class="tier-label">${rankDisplay}</span>
        </span>
        <span class="lp-cell">${p.lp} LP</span>
        <span class="wr-cell">
          <span class="wr-top"><span>${p.winrate}% WR</span></span>
          <span class="wr-bar"><span class="wr-fill" style="width:${p.winrate}%"></span></span>
        </span>
      `;
      rankingListEl.appendChild(row);
    });
  }

  function selectPlayer(id){
    state.selectedId = id;
    renderRanking();
    
    const player = state.players.find(p => p.id === id);
    const matchesHtml = player.partidas.map(m => `
      <div class="match">
        <img class="champ-icon" src="https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${m.campeon.replace(/[^a-zA-Z0-9]/g,'')}.png" onerror="this.style.visibility='hidden'">
        <span>
          <div class="match-champ">${m.campeon}</div>
          <div class="match-kda">${m.kda} KDA</div>
        </span>
        <span class="lp-diff ${m.resultado}">${m.resultado === 'victoria' ? '(+? LP)' : '(-? LP)'}</span>
        <span class="result-chip ${m.resultado}">${m.resultado === 'victoria' ? 'Victoria' : 'Derrota'}</span>
      </div>
    `).join('');

    historyPanelEl.innerHTML = `<div class="matches">${matchesHtml}</div>`;
  }

  function buildChart(){
    const allDates = new Set();
    state.players.forEach(p => p.historialLP.forEach(pt => allDates.add(pt.fecha || 'Inicio')));
    const labels = [...allDates];

    const palette = ['#8b5cf6','#38bdf8','#34d399','#f472b6','#fbbf24','#f87171','#a78bfa','#60a5fa'];

    const datasets = state.players.map((p, i) => {
      const byDate = new Map(p.historialLP.map(pt => [pt.fecha || 'Inicio', pt.lp]));
      return {
        label: p.nombre,
        data: labels.map(d => byDate.has(d) ? byDate.get(d) : null),
        borderColor: palette[i % palette.length],
        backgroundColor: palette[i % palette.length],
        borderWidth: 2, tension: 0.3, spanGaps: true
      };
    });

    // Ahora la gráfica nunca opaca a los demás, siempre se ven todos
    new Chart(document.getElementById('lp-chart').getContext('2d'), {
      type: 'line', data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels:{color:'#9a9aa3'} } },
        scales: {
          x: { grid: { color: '#1c1c22' }, ticks: { color: '#5c5c66' } },
          y: { grid: { color: '#1c1c22' }, ticks: { color: '#5c5c66' } },
        },
      },
    });
  }
});
</script>
</body>
</html>
