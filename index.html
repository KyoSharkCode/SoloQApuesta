<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo LoL · Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0a0c;
    --panel:#131317;
    --panel-2:#18181d;
    --border:#232329;
    --text:#f2f2f5;
    --text-dim:#9a9aa3;
    --text-faint:#5c5c66;
    --accent:#8b5cf6;
    --accent-soft:#a78bfa;
    --accent-glow:rgba(139,92,246,.35);
    --win:#34d399;
    --win-bg:rgba(52,211,153,.12);
    --loss:#f87171;
    --loss-bg:rgba(248,113,113,.12);
    --radius:14px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(139,92,246,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  ::selection{background:var(--accent-glow);}
  a{color:inherit;}

  :focus-visible{
    outline:2px solid var(--accent-soft);
    outline-offset:3px;
    border-radius:6px;
  }

  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:48px 20px 80px;
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:40px;
    padding-bottom:24px;
    border-bottom:1px solid var(--border);
  }
  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent-soft);
    margin:0 0 8px;
  }
  h1{
    font-size:clamp(28px,4vw,38px);
    font-weight:800;
    letter-spacing:-.02em;
    margin:0;
  }
  .update-badge{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    padding:8px 14px;
    border-radius:999px;
  }
  .pulse{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 0 var(--accent-glow);
    animation:pulse 2.2s infinite;
    flex-shrink:0;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 var(--accent-glow);}
    70%{box-shadow:0 0 0 8px rgba(139,92,246,0);}
    100%{box-shadow:0 0 0 0 rgba(139,92,246,0);}
  }

  section{margin-bottom:52px;}
  .section-title{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:18px;
  }
  .section-title h2{
    font-size:15px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:0;
  }
  .section-title span{
    font-size:12px;
    color:var(--text-faint);
  }

  /* ---------- RANKING ---------- */
  .ranking{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .rank-head{
    display:grid;
    grid-template-columns:40px 1fr 130px 90px 120px;
    gap:12px;
    padding:0 16px 10px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .rank-row{
    display:grid;
    grid-template-columns:40px 1fr 130px 90px 120px;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease, background .15s ease;
    text-align:left;
    color:inherit;
    font:inherit;
  }
  .rank-row:hover{
    border-color:#33333c;
    transform:translateY(-1px);
  }
  .rank-row.active{
    border-color:var(--accent);
    background:linear-gradient(180deg, rgba(139,92,246,.10), rgba(139,92,246,.03));
    box-shadow:0 0 0 1px var(--accent-glow) inset;
  }
  .rank-pos{
    font-size:13px;
    font-weight:700;
    color:var(--text-faint);
    text-align:center;
  }
  .rank-row.active .rank-pos{color:var(--accent-soft);}

  .player-cell{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .avatar{
    width:34px;height:34px;
    border-radius:9px;
    background:var(--panel-2);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;
    color:var(--text-dim);
    flex-shrink:0;
  }
  .player-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .tier-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    font-weight:700;
  }
  .tier-crest{
    width:16px;height:16px;
    transform:rotate(45deg);
    border-radius:4px;
    flex-shrink:0;
  }
  .tier-label{white-space:nowrap;}

  .lp-cell{font-size:13px;font-weight:600;color:var(--text-dim);}
  .rank-row.active .lp-cell{color:var(--text);}

  .wr-cell{display:flex;flex-direction:column;gap:5px;}
  .wr-top{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);}
  .wr-bar{
    height:4px;
    background:var(--panel-2);
    border-radius:99px;
    overflow:hidden;
  }
  .wr-fill{
    height:100%;
    background:linear-gradient(90deg,var(--accent-soft),var(--accent));
    border-radius:99px;
  }

  /* tier colors */
  .tier-iron .tier-crest{background:#5b5c63;}
  .tier-bronze .tier-crest{background:#a9754f;}
  .tier-silver .tier-crest{background:#9fb0c2;}
  .tier-gold .tier-crest{background:#d8ad3d;}
  .tier-platinum .tier-crest{background:#3fc6b6;}
  .tier-emerald .tier-crest{background:#3fcf7f;}
  .tier-diamond .tier-crest{background:#6f8bff;}
  .tier-master .tier-crest{background:#b154e8;}
  .tier-grandmaster .tier-crest{background:#e5484d;}
  .tier-challenger .tier-crest{background:linear-gradient(135deg,#8ce6e0,#f4d160);}

  /* ---------- HISTORY ---------- */
  .history-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
  }
  .history-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border);
  }
  .history-head .avatar{width:40px;height:40px;font-size:15px;}
  .history-head h3{margin:0;font-size:17px;font-weight:700;}
  .history-head p{margin:2px 0 0;font-size:12px;color:var(--text-dim);}

  .matches{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .match{
    display:grid;
    grid-template-columns:44px 1fr auto auto;
    align-items:center;
    gap:14px;
    padding:10px 12px;
    border-radius:10px;
    background:var(--panel-2);
    border:1px solid var(--border);
  }
  .champ-icon{
    width:36px;height:36px;
    border-radius:8px;
    object-fit:cover;
    background:#1d1d24;
    border:1px solid var(--border);
  }
  .match-champ{font-size:13px;font-weight:600;}
  .match-kda{font-size:12px;color:var(--text-dim);}
  .result-chip{
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    padding:4px 10px;
    border-radius:99px;
    text-transform:uppercase;
  }
  .result-chip.victoria{color:var(--win);background:var(--win-bg);}
  .result-chip.derrota{color:var(--loss);background:var(--loss-bg);}

  .empty-state{
    color:var(--text-faint);
    font-size:13px;
    text-align:center;
    padding:30px 0;
  }

  /* ---------- CHART ---------- */
  .chart-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    height:300px;
  }

  @media (max-width:640px){
    .rank-head{display:none;}
    .rank-row{
      grid-template-columns:1fr;
      gap:10px;
    }
    .rank-pos{
      position:absolute;
      margin-top:-4px;
    }
    .lp-cell,.wr-cell{padding-left:46px;}
    .match{grid-template-columns:36px 1fr auto;}
    .match-kda{grid-column:2/3;}
    .result-chip{grid-row:1/3;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Temporada 2026</p>
      <h1 id="titulo">Torneo entre Amigos</h1>
    </div>
    <div class="update-badge">
      <span class="pulse"></span>
      <span id="ultima-actualizacion">Cargando datos…</span>
    </div>
  </header>

  <section id="seccion-ranking">
    <div class="section-title">
      <h2>Ranking Global</h2>
      <span>Ordenado por rango y LP</span>
    </div>
    <div class="rank-head">
      <span>#</span>
      <span>Jugador</span>
      <span>Rango</span>
      <span>LP</span>
      <span>Winrate</span>
    </div>
    <div class="ranking" id="ranking-list"></div>
  </section>

  <section id="seccion-historial">
    <div class="section-title">
      <h2>Historial Individual</h2>
      <span>Últimas 5 partidas</span>
    </div>
    <div class="history-panel" id="history-panel">
      <p class="empty-state">Selecciona un jugador del ranking para ver su historial.</p>
    </div>
  </section>

  <section id="seccion-grafica">
    <div class="section-title">
      <h2>Progreso de LP</h2>
      <span>Evolución histórica</span>
    </div>
    <div class="chart-panel">
      <canvas id="lp-chart"></canvas>
    </div>
  </section>
</div>

<script>
(() => {
  const TIER_ORDER = ['IRON','BRONZE','SILVER','GOLD','PLATINUM','EMERALD','DIAMOND','MASTER','GRANDMASTER','CHALLENGER'];
  const DIVISIONLESS = ['MASTER','GRANDMASTER','CHALLENGER'];

  const state = { players: [], selectedId: null, chart: null };

  const rankingListEl = document.getElementById('ranking-list');
  const historyPanelEl = document.getElementById('history-panel');
  const updateBadgeEl = document.getElementById('ultima-actualizacion');
  const tituloEl = document.getElementById('titulo');

  init();

  async function init(){
    try{
      const res = await fetch('datos.json', { cache: 'no-store' });
      if(!res.ok) throw new Error('No se pudo cargar datos.json');
      const data = await res.json();

      if(data.torneo) tituloEl.textContent = data.torneo;
      renderLastUpdate(data.ultimaActualizacion);

      state.players = sortPlayers(data.jugadores || []);
      renderRanking();
      buildChart();

      if(state.players.length){
        selectPlayer(state.players[0].id);
      }
    }catch(err){
      rankingListEl.innerHTML = `<p class="empty-state">No se pudieron cargar los datos (${err.message}). Verifica que datos.json exista.</p>`;
      updateBadgeEl.textContent = 'Sin datos';
    }
  }

  // ---------- helpers ----------
  function tierIndex(tier){
    return TIER_ORDER.indexOf((tier || '').toUpperCase());
  }

  function rankScore(p){
    const ti = tierIndex(p.rango);
    if(DIVISIONLESS.includes((p.rango || '').toUpperCase())){
      return ti * 100000 + (p.lp || 0);
    }
    const divNum = { 'IV':1,'III':2,'II':3,'I':4 }[p.division] || 0;
    return ti * 100000 + divNum * 2000 + (p.lp || 0);
  }

  function sortPlayers(players){
    return [...players].sort((a,b) => rankScore(b) - rankScore(a));
  }

  function initials(name){
    return (name || '?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
  }

  function tierClass(tier){
    return 'tier-' + (tier || '').toLowerCase();
  }

  function tierDisplay(p){
    const tier = (p.rango || '').toUpperCase();
    const pretty = tier.charAt(0) + tier.slice(1).toLowerCase();
    if(DIVISIONLESS.includes(tier)) return pretty;
    return `${pretty} ${p.division || ''}`.trim();
  }

  function championIconUrl(champ){
    const id = (champ || '').replace(/[^a-zA-Z0-9]/g,'');
    return `https://ddragon.leagueoflegends.com/cdn/14.20.1/img/champion/${id}.png`;
  }

  function relativeTime(iso){
    if(!iso) return 'Fecha desconocida';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if(mins < 1) return 'Justo ahora';
    if(mins < 60) return `Hace ${mins} min`;
    const hours = Math.round(mins / 60);
    if(hours < 24) return `Hace ${hours} h`;
    const days = Math.round(hours / 24);
    return `Hace ${days} d`;
  }

  function renderLastUpdate(iso){
    updateBadgeEl.textContent = 'Última actualización: ' + relativeTime(iso);
    if(iso) updateBadgeEl.title = new Date(iso).toLocaleString('es-ES');
  }

  // ---------- ranking ----------
  function renderRanking(){
    rankingListEl.innerHTML = '';
    state.players.forEach((p, i) => {
      const row = document.createElement('button');
      row.className = 'rank-row' + (p.id === state.selectedId ? ' active' : '');
      row.type = 'button';
      row.setAttribute('aria-pressed', p.id === state.selectedId);
      row.addEventListener('click', () => selectPlayer(p.id));

      row.innerHTML = `
        <span class="rank-pos">${i + 1}</span>
        <span class="player-cell">
          <span class="avatar">${initials(p.nombre)}</span>
          <span class="player-name">${p.nombre}</span>
        </span>
        <span class="tier-badge ${tierClass(p.rango)}">
          <span class="tier-crest"></span>
          <span class="tier-label">${tierDisplay(p)}</span>
        </span>
        <span class="lp-cell">${p.lp ?? 0} LP</span>
        <span class="wr-cell">
          <span class="wr-top"><span>${p.winrate ?? 0}%</span><span>${(p.victorias ?? 0)}V ${(p.derrotas ?? 0)}D</span></span>
          <span class="wr-bar"><span class="wr-fill" style="width:${p.winrate ?? 0}%"></span></span>
        </span>
      `;
      rankingListEl.appendChild(row);
    });
  }

  // ---------- selection ----------
  function selectPlayer(id){
    state.selectedId = id;
    renderRanking();
    renderHistory(state.players.find(p => p.id === id));
    updateChartHighlight(id);
  }

  // ---------- history ----------
  function renderHistory(player){
    if(!player){
      historyPanelEl.innerHTML = '<p class="empty-state">Selecciona un jugador del ranking para ver su historial.</p>';
      return;
    }
    const partidas = (player.partidas || []).slice(0, 5);
    const matchesHtml = partidas.length
      ? partidas.map(m => `
        <div class="match">
          <img class="champ-icon" src="${championIconUrl(m.campeon)}" alt="${m.campeon}"
               onerror="this.style.visibility='hidden'">
          <span>
            <div class="match-champ">${m.campeon}</div>
            <div class="match-kda">${m.kda} KDA</div>
          </span>
          <span class="result-chip ${m.resultado}">${m.resultado === 'victoria' ? 'Victoria' : 'Derrota'}</span>
        </div>
      `).join('')
      : '<p class="empty-state">Sin partidas registradas.</p>';

    historyPanelEl.innerHTML = `
      <div class="history-head">
        <span class="avatar">${initials(player.nombre)}</span>
        <div>
          <h3>${player.nombre}</h3>
          <p>${tierDisplay(player)} · ${player.lp ?? 0} LP · ${player.winrate ?? 0}% winrate</p>
        </div>
      </div>
      <div class="matches">${matchesHtml}</div>
    `;
  }

  // ---------- chart ----------
  function buildChart(){
    const allDates = new Set();
    state.players.forEach(p => (p.historialLP || []).forEach(pt => allDates.add(pt.fecha)));
    const labels = [...allDates].sort();

    const palette = ['#8b5cf6','#38bdf8','#34d399','#f472b6','#fbbf24','#f87171','#a78bfa','#60a5fa'];

    const datasets = state.players.map((p, i) => {
      const byDate = new Map((p.historialLP || []).map(pt => [pt.fecha, pt.lp]));
      const baseColor = palette[i % palette.length];
      return {
        id: p.id,
        label: p.nombre,
        data: labels.map(d => byDate.has(d) ? byDate.get(d) : null),
        spanGaps: true,
        baseColor,
        borderColor: baseColor,
        backgroundColor: baseColor,
        borderWidth: 2,
        pointRadius: 2,
        pointHoverRadius: 4,
        tension: .35,
      };
    });

    const ctx = document.getElementById('lp-chart').getContext('2d');
    state.chart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'nearest', intersect: false },
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#9a9aa3', usePointStyle: true, boxWidth: 8, font: { family: 'Inter', size: 11 } },
            onClick: (evt, item) => selectPlayer(datasets[item.datasetIndex].id),
          },
          tooltip: {
            backgroundColor: '#18181d',
            borderColor: '#232329',
            borderWidth: 1,
            titleColor: '#f2f2f5',
            bodyColor: '#9a9aa3',
            padding: 10,
          },
        },
        scales: {
          x: { grid: { color: '#1c1c22' }, ticks: { color: '#5c5c66', font: { family: 'Inter', size: 10 } } },
          y: { grid: { color: '#1c1c22' }, ticks: { color: '#5c5c66', font: { family: 'Inter', size: 10 } } },
        },
      },
    });
  }

  function updateChartHighlight(id){
    if(!state.chart) return;
    state.chart.data.datasets.forEach(ds => {
      const isSelected = ds.id === id;
      const alpha = isSelected ? 1 : .25;
      ds.borderWidth = isSelected ? 3 : 1.5;
      ds.borderColor = hexToRgba(ds.baseColor, alpha);
      ds.backgroundColor = hexToRgba(ds.baseColor, alpha);
      ds.order = isSelected ? 0 : 1;
    });
    state.chart.update();
  }

  function hexToRgba(hex, alpha){
    const clean = hex.startsWith('#') ? hex.slice(1) : hex;
    const bigint = parseInt(clean.length === 3
      ? clean.split('').map(c => c + c).join('')
      : clean, 16);
    const r = (bigint >> 16) & 255, g = (bigint >> 8) & 255, b = bigint & 255;
    return `rgba(${r},${g},${b},${alpha})`;
  }
})();
</script>
</body>
</html>
