<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloQ Reto - Ranking</title>
    <!-- Google Fonts & Chart.js -->
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #121216;
            --accent-purple: #8b5cf6;
            --accent-pastel: #a78bfa;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --win-color: #34d399;
            --loss-color: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 1000px; }
        header { margin-bottom: 3rem; }
        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; }
        
        section { background: var(--card-bg); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; border: 1px solid #1f1f2e; }
        section h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        
        /* Tabla del Ranking */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: var(--text-muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; padding-bottom: 1rem; border-bottom: 1px solid #1f1f2e; }
        td { padding: 1rem 0; border-bottom: 1px solid #1f1f2e; font-size: 0.95rem; }
        tr.clickable { cursor: pointer; transition: background 0.2s; }
        tr.clickable:hover { background: #1a1a24; }
        .rank-num { font-weight: 800; color: var(--accent-pastel); width: 40px; }
        .player-name { font-weight: 600; }
        
        /* Historial */
        .history-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-radius: 8px; background: #16161f; border-left: 4px solid transparent; }
        .history-item.victoria { border-left-color: var(--win-color); }
        .history-item.derrota { border-left-color: var(--loss-color); }
        .match-main { display: flex; gap: 1.5rem; align-items: center; }
        .match-status { font-weight: 800; font-size: 0.85rem; text-transform: uppercase; }
        .match-status.victoria { color: var(--win-color); }
        .match-status.derrota { color: var(--loss-color); }
        .champ-name { font-weight: 600; }
        .match-kda { font-size: 0.9rem; color: var(--text-muted); }
        .match-time { font-size: 0.85rem; color: var(--text-muted); }

        #empty-history { color: var(--text-muted); text-align: center; padding: 2rem 0; font-size: 0.9rem; }
        canvas { max-height: 250px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <p class="subtitle">Temporada 2026</p>
            <h1>Torneo entre Amigos</h1>
            <p id="update-time" style="font-size: 0.8rem; color: var(--text-muted);"></p>
        </header>

        <section id="ranking-section">
            <h2>Ranking Global <span style="font-size: 0.8rem; font-weight: 400; text-transform: none; color: var(--accent-pastel); margin-left: 10px;">(Haz clic en un jugador para ver su historial)</span></h2>
            <table>
                <thead>
                    <tr>
                        <th class="rank-num">#</th>
                        <th>Jugador</th>
                        <th>Rango</th>
                        <th>LP</th>
                        <th>Winrate</th>
                    </tr>
                </thead>
                <tbody id="ranking-table-body">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </section>

        <section id="history-section">
            <h2>Historial Individual</h2>
            <div id="empty-history">Selecciona un jugador del ranking arriba para ver sus últimas partidas.</div>
            <div id="history-container" class="history-list" style="display: none;">
                <!-- Se llena con JS -->
            </div>
        </section>

        <section id="chart-section">
            <h2>Progreso de LP</h2>
            <canvas id="lpChart"></canvas>
        </section>
    </div>

    <script>
        let chartInstance = null;

        // Sistema de valores para ordenar los Elos de LoL correctamente
        const tierValues = { 'Challenger':2500, 'Grandmaster':2400, 'Master':2300, 'Diamond':1900, 'Emerald':1500, 'Platinum':1100, 'Gold':700, 'Silver':300, 'Bronze':100, 'Iron':0, 'Unranked':-1 };
        const rankValues = { 'I': 300, 'II': 200, 'III': 100, 'IV': 0 };

        function calcularPuntosAbsolutos(rangoStr, lp) {
            if (!rangoStr || rangoStr === "Unranked") return -1;
            const partes = rangoStr.split(' ');
            const tier = partes[0];
            const division = partes[1] || 'I';
            const baseTier = tierValues[tier] !== undefined ? tierValues[tier] : 0;
            const baseRank = rankValues[division] !== undefined ? rankValues[division] : 0;
            return baseTier + baseRank + lp;
        }

        async function cargarDatos() {
            try {
                const response = await fetch('datos.json');
                const jugadores = await response.json();

                // 1. Ordenar jugadores por Rango y LP de mayor a menor
                jugadores.sort((a, b) => {
                    return calcularPuntosAbsolutos(b.rango, b.lp) - calcularPuntosAbsolutos(a.rango, a.lp);
                });

                // 2. Dibujar la tabla de posiciones
                const tbody = document.getElementById('ranking-table-body');
                tbody.innerHTML = '';
                
                jugadores.forEach((jugador, index) => {
                    const tr = document.createElement('tr');
                    tr.className = 'clickable';
                    tr.innerHTML = `
                        <td class="rank-num">${index + 1}</td>
                        <td class="player-name">${jugador.nombre}</td>
                        <td>${jugador.rango}</td>
                        <td style="font-weight: 600; color: var(--accent-pastel);">${jugador.lp}</td>
                        <td>${jugador.winrate}</td>
                    `;
                    tr.addEventListener('click', () => mostrarHistorial(jugador));
                    tbody.appendChild(tr);
                });

                // 3. Generar la gráfica de Progreso con los datos actuales
                inicializarGrafica(jugadores);
                
                // Mostrar hora de actualización estética
                document.getElementById('update-time').innerText = `Última sincronización: Hace unos instantes`;

            } catch (error) {
                console.error("Error cargando el archivo JSON:", error);
                document.getElementById('ranking-table-body').innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Error cargando datos.json. Asegúrate de que el script de Python ya corrió con éxito.</td></tr>`;
            }
        }

        function mostrarHistorial(jugador) {
            document.getElementById('empty-history').style.display = 'none';
            const container = document.getElementById('history-container');
            container.style.display = 'flex';
            container.innerHTML = '';

            if (!jugador.historial || jugador.historial.length === 0) {
                container.innerHTML = `<div style="color:var(--text-muted); text-align:center; width:100%;">No hay partidas recientes en el historial.</div>`;
                return;
            }

            jugador.historial.forEach(partida => {
                const claseResultado = partida.resultado.toLowerCase() === 'victoria' ? 'victoria' : 'derrota';
                const div = document.createElement('div');
                div.className = `history-item ${claseResultado}`;
                div.innerHTML = `
                    <div class="match-main">
                        <span class="match-status ${claseResultado}">${partida.resultado}</span>
                        <span class="champ-name">${partida.campeon}</span>
                    </div>
                    <span class="match-kda">${partida.kda}</span>
                    <span class="match-time">${partida.duracion}</span>
                `;
                container.appendChild(div);
            });
        }

        function initializeChart(jugadores) {
            // Función vacía o deprecada si se usa inicializarGrafica
        }

        function inicializarGrafica(jugadores) {
            const ctx = document.getElementById('lpChart').getContext('2d');
            if (chartInstance) { chartInstance.destroy(); }

            const nombres = jugadores.map(j => j.nombre.split('#')[0]);
            const lps = jugadores.map(j => j.lp);

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: nombres,
                    datasets: [{
                        label: 'LP Actual',
                        data: lps,
                        backgroundColor: '#8b5cf6',
                        borderColor: '#a78bfa',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
